# ─────────────────────────────────────────────────────────────────────────
# render-earn-protect.yaml — Earn & Protect, deployed publicly (beta-ready).
#
# Deploys THREE things:
#   1. the service (web app /app, Telegram Mini App /miniapp, control room
#      /demo, JSON API) — public HTTPS, which the Telegram Mini App requires
#   2. Postgres (Render's filesystem is ephemeral — JSON stores would reset
#      on every deploy)
#   3. the Telegram bot as a background worker (it must outlive laptops)
#
# Deploy: Render dashboard → New → Blueprint → select this file.
# Fill in the sync:false env vars when prompted (marked below).
#
# After deploy:
#   - trader app:   https://<service>.onrender.com/app
#   - mini app:     https://<service>.onrender.com/miniapp
#   - control room: https://<service>.onrender.com/demo?token=<EP_ADMIN_TOKEN>
#   - traffic page: https://<service>.onrender.com/admin/funnel?token=<EP_ADMIN_TOKEN>
#     (EP_ADMIN_TOKEN is generated — read it in the dashboard → Environment)
#
# Going LIVE later (real OKX legs) — set manually on the service, never here:
#   DEMO_EXECUTION=okx_live LIVE_ENABLED=true OKX_EXECUTION_MODE=live
#   OKX_LIVE_CONFIRM=I_UNDERSTAND_REAL_MONEY + OKX_API_KEY/SECRET/PASSPHRASE
#   (fresh keys: trade-only, withdrawals OFF, IP-whitelist Render Singapore).
#   Region is singapore ⟹ same outbound IP pool as the OKX whitelist, so the
#   egress proxy is NOT needed when running here. Do an admin reset before
#   flipping so the live book starts clean of paper history.
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: atticus-earn-protect
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/hl-toggle-demo-9151
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/creditCollarDemoService.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_ENABLED
        value: "true"
      - key: DEMO_EXECUTION
        value: paper # beta lane; flip to okx_live manually with the full arming chain
      # BETA ALLOW-LIST (fill at deploy): comma-separated tester wallets. This is the guard
      # against third parties acting on others' addresses. "*" opens it to any address — only
      # do that deliberately at launch.
      - key: DEMO_ALLOWED_ACCOUNTS
        sync: false
      # RETAIL SKIN (default): every non-admin JSON response is passed through the retail view —
      # operator fields (hedge legs, instruments, gross/take, capital formulas, lane names, rule
      # internals, raw venue errors) never leave the server; refusals arrive as one retail
      # sentence. Set EP_SKIN=institutional on a partner instance to serve the full payload.
      - key: EP_SKIN
        value: retail
      # SHOWCASE (the landing card): a LONG position from three live public wallets — two medium
      # ($25k–150k) and one large ($150k–750k) — read off the leaderboard; the UTC hour picks
      # which is up (medium, large, medium). EP_SHOWCASE_ADDRESSES (comma-separated) curates the
      # set instead; EP_SHOWCASE_SIDES=long,short allows shorts; EP_SHOWCASE_SCAN = max rows read
      # per refresh (weighted toward medium, which is sparse; the read stops once the slots fill).
      - key: EP_SHOWCASE_ADDRESSES
        sync: false
      - key: EP_SHOWCASE_SIDES
        value: long
      - key: EP_SHOWCASE_SCAN
        value: "300"
      # Sister surfaces the site cross-links (nav switch, pitch, /video buttons, footer). Each link
      # fails closed: shown only while that host answers /healthz. The site's own /record,
      # /prediction and /prediction/record redirect there so the clicks land in the funnel
      # (read it at /admin/funnel?token=<EP_ADMIN_TOKEN>). An empty value switches a link off.
      - key: EP_TRACK_RECORD_URL
        value: https://facility.atticustrade.com
      - key: EP_PREDICTION_URL
        value: https://event.earnandprotect.xyz
      - key: EP_PREDICTION_RECORD_URL
        value: https://atticus-event-shadow.onrender.com
      - key: EP_ADMIN_TOKEN
        generateValue: true # control room / admin API token — read it from the dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: atticus-earn-protect-db
          property: connectionString
      # Launch gates: ToS ON for beta (normalizes the flow, records acceptances);
      # geofence off until counsel signs the list — flip EP_GEOFENCE=true at launch.
      - key: EP_TOS_REQUIRED
        value: "true"
      - key: EP_TOS_VERSION
        value: 2026-08-draft
      - key: EP_GEOFENCE
        value: "false"
      # Ops alerting (fill at deploy): knockouts, payout failures, stalled loops, reconcile
      # mismatches land in this private Telegram chat. Use the SAME bot token as the worker;
      # get your chat id by messaging @userinfobot.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALERT_CHAT_ID
        sync: false
      # Brand mark (finch) — set when the asset URL exists; renders next to "by ATTICUS".
      - key: EP_BRAND_LOGO_URL
        sync: false
      # ── Product shape flags (all default to the product as shipped; flip deliberately) ──
      # One shape: floor DEMO_FLOOR_PCT (0.06) + the widest listed cap that still pays, refused
      # under the cap guard (EP_MIN_CAP_PCT 0.02 daily / 0.04 weekly; band to EP_CAP_MAX_PCT).
      # EP_CAP_MODE: plain (default) is a plain collar — the cap leg is held to expiry, hedged leg
      # for leg, so gains above the cap are handed back at the close (they paid for the floor) and
      # the holder may RELEASE the cap at any time at the live OKX price (POST /api/release) to keep
      # a rally; a touch records, nothing closes. `knockout` is the previous rule (touch ends the
      # cycle, cap leg bought back at the writer's cost) — measured negative-EV, keep it off.
      # EP_TENOR: weekly (default) writes to the nearest listed Friday at least 3 days out, where the
      # credit is real (measured $2.71 vs $0.15 daily on 0.03 BTC); `daily` opts out.
      # EP_MIN_TAKE_BPS: notional fee floor on our take (0 = share only).
      # EP_CAP_RULE / EP_CAP_EXCEED_PROB: which paying cap strike is sold — `target` (default) takes the
      # most credit among strikes the market gives at most EP_CAP_EXCEED_PROB (0.20) odds of finishing
      # beyond this cycle (OKX mark vol); `widest` is the previous rule (the widest strike that pays).
      # EP_FLOOR_RULE: which depth the floor is written to — `fixed` (default) is DEMO_FLOOR_PCT, one
      # probe, today's behaviour; `tightest_paying` tries EP_FLOOR_MIN_PCT..EP_FLOOR_MAX_PCT (0.05..0.08,
      # step EP_FLOOR_STEP_PCT 0.01) most protective first and writes the shallowest depth whose net
      # credit clears EP_FLOOR_MIN_CREDIT_BPS (5) of notional, else the depth that pays most. The shadow
      # report's "Floor depth" card records what the rule would have picked before the default moves.
      # Retired 2026-09-20 and ignored if set: EP_CREDIT_MUST_CLEAR_FUNDING (funding is disclosed,
      # never a refusal) and EP_PRETOUCH_WORKING_ORDER (nothing rests on the venue).
      - key: EP_CAP_MODE
        value: plain
      - key: EP_TENOR
        value: weekly
      - key: EP_MIN_TAKE_BPS
        value: "0"
      - key: EP_CAP_RULE
        value: target
      - key: EP_CAP_EXCEED_PROB
        value: "0.20"
      - key: EP_FLOOR_RULE
        value: fixed
      # Cap watch: per-wrap headroom is always on (admin status) and prices the holder's release.
      # EP_HEADROOM_ALERT_BPS pages (knockout mode only) when one wrap's reserve passes this many bps
      # of its notional (an ATM weekly cap leg is ~200–250 bps).
      - key: EP_HEADROOM_ALERT_BPS
        value: "300"
      # Unwind queue (plain mode, live OKX lanes): on an early close the holder settles at the book's
      # mark-to-market at once; OUR legs go on a queue and are worked passive first (post-only at the
      # mid for EP_UNWIND_PASSIVE_MS, re-priced as the mid walks), then IOC — every step a receipt on
      # the wrap record, the realized-vs-book gap recorded as execution edge. A new wrap that needs
      # the same instruments on the opposite side takes them from the queue at the mid (no spread,
      # no fees, both sides). Off (default), the previous IOC-first path runs.
      - key: EP_UNWIND_QUEUE
        value: "1"

  - type: worker
    name: atticus-earn-protect-bot
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/hl-toggle-demo-9151
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/earnProtectTelegramBot.ts
    envVars:
      - key: NODE_ENV
        value: production
      # The bot's token from @BotFather (rotate any token that was ever pasted in a chat).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Public base of the service above, e.g. https://atticus-earn-protect.onrender.com
      - key: EP_API_BASE
        sync: false
      # Mini App URL = EP_API_BASE + /miniapp (must be https; drives buttons + chat menu).
      - key: EP_MINIAPP_URL
        sync: false
      # NOTE: the worker filesystem is ephemeral — chat→address bindings reset on redeploys
      # (users just re-paste once; notifications never replay). Postgres-backed chat store is
      # on the leftover list before public launch.

databases:
  - name: atticus-earn-protect-db
    plan: basic-256mb
    region: singapore
