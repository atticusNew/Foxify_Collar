# ─────────────────────────────────────────────────────────────────────────
# render-okx-mirror.yaml — Foxify OKX credit-collar SHADOW MIRROR
#
# A DEDICATED, ISOLATED service for the Foxify pilot mirror. It does NOT share
# config, credentials, or a database with the live `foxify-pilot-new*` services.
# It runs the credit-collar shadow loop (`shadow:service`) at the REAL product
# terms: OKX hedge venue, 24h tenor, $80 credit, dynamic 3% floor, pass-through
# model, OKX-measured capital. Paper settlement only — read-only, live tiers OFF,
# NO venue credentials, NO order placement, NO Foxify/PILOT routes.
#
# This YAML is the SOURCE OF TRUTH for the service: do not edit envs in the
# dashboard (a blueprint sync will overwrite them). Change them here and push.
#
# Deploy: Render dashboard → New → Blueprint → select this file. It creates one
# web service (`foxify-okx-mirror`) with a 1 GB disk for the durable track record.
# Dashboard: https://foxify-okx-mirror.onrender.com  (/, /api/scorecard, /healthz)
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: foxify-okx-mirror
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/bullish-fees-hedge-receipt-9151
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api run shadow:service
    healthCheckPath: /healthz   # always-open, token-free, fast 200 (avoids the deploy-timeout)
    disk:
      name: okx-mirror-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production

      # ── Mirror terms: OKX hedge venue, 24h tenor, $80 credit, dynamic 3% floor ──
      - key: SHADOW_HEDGE_VENUE
        value: okx
      - key: SHADOW_SETTLEMENT_HORIZON_MIN
        value: "1440"             # 24h — settle at the REAL tenor (not the old 60-min)
      - key: HARNESS_FEE_USDC
        value: "80"               # $80 credit to Foxify
      - key: HARNESS_TENOR_DAYS
        value: "1"                # 24h option pricing tenor
      - key: HARNESS_MAX_FLOOR_PCT
        value: "0.03"             # 3% starting floor (cap solved per-vol)
      - key: SHADOW_ADAPTIVE_FLOOR
        value: "true"             # dynamic bands ON
      - key: SHADOW_ADAPTIVE_FLOOR_CAP
        value: "0.05"             # never deepen the floor past 5%
      - key: SHADOW_ADAPTIVE_FLOOR_STEP
        value: "0.005"
      - key: HARNESS_BULLISH_WEIGHT
        value: "0"                # no Bullish routing bias (OKX is forced by SHADOW_HEDGE_VENUE)

      # ── Volume + cadence (higher volume for statistical confidence) ──
      - key: SHADOW_N_POSITIONS
        value: "20"               # ~20 opened per cycle
      - key: SHADOW_LOOP_INTERVAL_MS
        value: "900000"           # one cycle / 15 min
      - key: SHADOW_POSITION_USDC
        value: "50000"
      - key: SHADOW_TIER0_CAP_USDC
        value: "2000000"          # headroom above 20 × $50k per cycle

      # ── Capital inputs (OKX-measured: matched-book PM netting) ──
      - key: SHADOW_SHORT_OPTION_IM_FRACTION
        value: "0.14"
      - key: SHADOW_PM_NETTING
        value: "0.078"
      - key: SHADOW_COST_OF_CAPITAL
        value: "0.12"

      # ── Fresh, disk-persistent stores (survive redeploys; clean slate) ──
      - key: SHADOW_STORE_PATH
        value: /var/data/okx-mirror-scorecards.jsonl
      - key: SHADOW_OPEN_POSITIONS_PATH
        value: /var/data/okx-mirror-open.jsonl
      - key: SHADOW_SETTLEMENT_LEDGER_PATH
        value: /var/data/okx-mirror-settlements.jsonl
      - key: SHADOW_COLLATERAL_PATH
        value: /var/data/okx-mirror-collateral.json

      # ── Public market-data bases (read-only; NO API keys) ──
      - key: OKX_REST_BASE
        value: https://www.okx.com
      - key: DERIBIT_REST_BASE
        value: https://www.deribit.com/api/v2
      - key: BULLISH_REST_BASE
        value: https://api.exchange.bullish.com

      # ── Optional ECDSA settlement-oracle keys (set in dashboard for audit
      #    continuity; ephemeral keypair generated if unset). ──
      - key: ORACLE_PRIVATE_KEY_PEM
        sync: false
      - key: ORACLE_PUBLIC_KEY_PEM
        sync: false
      # ── Optional read-only dashboard bearer token (leave unset = open page;
      #    /healthz is always open regardless). ──
      - key: SHADOW_DASHBOARD_TOKEN
        sync: false
