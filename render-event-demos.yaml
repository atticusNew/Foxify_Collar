      #   then holds a cookie (HttpOnly, 12 hours; EVENT_X_ADMIN_SESSION_HOURS, 1 to 720) that no
      #   script can read. Replacing this token ends every sign-in. No page carries the token on
      #   a link. On a route the public also reads (/healthz, /scoreboard, a slate), the
      #   operator's view is asked for with ?as=operator, so a signed-in operator who opens a
