      #                                         the check's ledger question. Default /var/data, the
      #                                         mountPath of this service's disk.
      # REAL FILLS (realizedBook.ts, realizedRecon.ts): the real orders above are kept as their own
      #   book, replayed from hedge-receipts.jsonl, lock-pending.jsonl and the lock ledgers. A line
      #   counts as a real fill only when the executor marked it filled at a venue (fill.simulated
      #   false); an order that errored after it left is listed as not counted, never guessed.
      #   Operator: GET /api/shadow/realized is the book (per lock, per UTC day, per venue) and the
      #   kept daily checks; add ?day=YYYY-MM-DD to check that UTC day against the venues now (read
      #   only, not kept). POST /api/shadow/realized/check?day=YYYY-MM-DD checks a day that has ended
      #   and keeps it. GET /api/shadow/realized.csv (?month=YYYY-MM) is the monthly accounting export.
      #   THE DAILY CHECK: half an hour past midnight UTC the day that ended is compared, our ledger's
      #   real fills against each venue's own, once; one line is appended to realized-recon.jsonl
      #   beside the lock ledger. Each venue reads agrees, differs, or could not be checked with the
      #   reason. A venue that differs is paged (kind venue_fills_differ). the operator's /healthz carries
      #   realized.dailyCheck: `lastRun` and `lastDiffers`. The venues are read with the keys already
      #   set, signed GETs only; nothing is placed or moved:
      #     Kalshi     KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM: the account's own list of the day's
      #                fills, which also covers the orders the aggregator's pod sent into our
      #                subaccount. The key must be able to read the portfolio and must not be locked
      #                to another subaccount. With only the aggregator's TRADE key set, each order
      #                our ledger names is read back from the aggregator instead.
      #     ProphetX   AGGREGATOR_TRADE_KEY_ID / AGGREGATOR_TRADE_PRIVATE_KEY_HEX: the fills of each
      #                order our ledger names (that surface has no list of the day).
      #     Novig      NOVIG_TRADE_KEY_ID / NOVIG_TRADE_PRIVATE_KEY_PEM: the key's own list of the day.
      #     No key for a venue: "could not be checked: no key for <venue>". Never "agrees".
      #   EVENT_REALIZED_RECON_DAILY=0          optional; turns the timer off (the routes stay)
      #   EVENT_REALIZED_RECON_AFTER_MINUTES=30 optional; how long past midnight UTC the timer waits
      #   EVENT_REALIZED_RECON_PATH=...         optional; moves realized-recon.jsonl
      #   EVENT_RECON_KALSHI_SUBACCOUNTS=0,1    optional; the Kalshi subaccounts to list. Unset: every
      #                                         subaccount the key sees, so a trade made by hand in
      #                                         the same account shows as at the venue and not on
      #                                         our ledger. Name ours to leave the others out.
      #   The record page shows a Real fills card once there is a real fill: counts and cash, no
      #   venue named, our result only when every figure in it is on the record.
      # IN PLAY (lockWindow.ts): a game can be locked in from seven days out, through the last 45
      #   minutes and while it is being played. On by default.
      #   EVENT_X_IN_PLAY=0                     optional; turns it off (0, false, no, off): the lock path
      #                                         closes 45 minutes before the start, as it did before.
      #   EVENT_X_IN_PLAY_HOURS=4               optional; how long after the start a game stays open.
      #   EVENT_SHADOW_SCAN_IN_PLAY=1           optional, off by default: lets the automatic paper scan
      #                                         open records on games under way. Left off so the public
      #                                         record is not flattered by paper fills at a moving book.
      #   During a game the book moves between the read and the order. With real orders on, HEDGE
      #   FIRST is what makes that safe: a moved book fills nothing and locks nothing. In a dry run
      #   an in-play lock is a paper record at the book as read. A hedged lock cannot be left early
      #   once the game has started (the leave window still closes before the start); it settles.
      # Pre-flight (operator): GET /api/shadow/hedges/preflight?ticker=KX... reads balance and the rails
      #   (via aggregator: the pod's identity, its Kalshi cash and whether the key may trade).
      # The pod (operator): GET /api/shadow/hedges/pod reads the aggregator's side — pod, cash, positions,
      #   and every receipt on our trail that went that way. ?ticker= narrows the positions.
      # KALSHI ACCOUNT (operator; needs KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM, in any strategy):
      #   GET /api/shadow/kalshi/account                  API tier and grants, cash per shard, subaccounts per shard, the API keys, what to do next
      #   GET /api/shadow/kalshi/keys                     the API keys: id, name, which subaccount each is locked to, which one is ours
      #   Writes are a POST with a JSON body, or, from a browser signed in at /operator and opened from the box on that page, a GET with confirm=yes and the fields in the query:
      #     /api/shadow/kalshi/account/upgrade?confirm=yes                      the permanent Advanced grant (Kalshi wants one API-created order among the last 100)
      #     /api/shadow/kalshi/subaccounts?confirm=yes&shard=0                  the next numbered subaccount on that shard (again with shard=3 for basketball)
      #     /api/shadow/kalshi/subaccounts/transfer?confirm=yes&from=0&to=1&cents=5000&shard=0     cash between subaccounts, one shard
      #     /api/shadow/kalshi/shards/transfer?confirm=yes&fromShard=0&toShard=3&cents=5000       the primary's cash across shards
      #     /api/shadow/kalshi/keys?confirm=yes&name=parlayx-pod&subaccount=1  mint a key restricted to that subaccount (omit subaccount for an
