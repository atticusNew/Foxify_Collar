      #                                                                        that one answer and nowhere else: hand it to the pod at once.
      #     /api/shadow/kalshi/keys/delete?confirm=yes&id=…                     revoke a key (refuses the key this service signs with)
      #   Shards: Kalshi holds a subaccount's cash per matching engine; NFL is shard 0, basketball/baseball/
      #   tennis shard 3; a subaccount that hedges both needs cash on both. Nothing here places an order.
      # Resend (operator): POST /api/shadow/hedges/resend?ticker=KX... hedges an open lock again when
      #   its hedge never reached the venue (simulated fill on the trail); refuses once a live fill
      #   exists unless &force=1. Orders go to Kalshi's V2 path (POST /portfolio/events/orders).
      # Lock reset (operator): POST /api/shadow/lock/reset?ticker=KX... moves one lock's lines to an
      #   archive beside the lock ledger so the market can be locked again; names the live fills the
      #   venue still holds for the old lock. The holder's receipt: GET /api/shadow/receipt?ticker= (lock key).
      # LOCK IN (the tap from the browser extension; off here, set in the dashboard, never in git):
      #   EVENT_SHADOW_LOCK_KEY=<12+ chars>     opens GET /api/shadow/markets, GET /api/shadow/quote,
      #                                         GET /api/shadow/positions and POST /api/shadow/lock to
      #                                         callers sending x-lock-key.
      #                                         Unset: those routes answer 404 to anyone but the operator.
      #   Locks are written to their own ledger beside the scan's (lock-ledger.jsonl on the same
      #   disk; EVENT_SHADOW_LOCK_LEDGER_PATH to move it), so a holder may lock a market the scan
      #   already shows. Same settlement; never early-closed. Operator export: /api/shadow/export?ledger=lock
      #   Tickers on EVENT_HEDGE_LIVE_TICKERS are hedged on Kalshi's own No side and skipped by the scan.
      # HOLDER POSITIONS (optional; confirms what the holder has at the venue so the extension does not
      # have to read sizes off the page). Two venue APIs are spoken; the variables set pick one. Set in
      # the dashboard, never in git. Unset: /api/shadow/positions answers configured:false and the
      # extension reads the row from the page.
      # Bearer venue (partner API, session login; the venue issues the pair at Settings > Token. It is an
      # account key pair, so it could trade: dedicated pair, service env only, revoke after the recording.
      # The service only logs in and reads open plays, tournaments, events, markets):
      #   VENUE_API_HOST=https://cash.api..../partner   the partner API base, with the /partner path
      #   VENUE_API_ACCESS_KEY=<access key>
      #   VENUE_API_SECRET_KEY=<secret key>
      # Signed venue (read-only key minted with scripts/venueReadKey.ts; lists positions, nothing else):
      #   VENUE_API_HOST=https://api....         the venue's API host (paper host for a rehearsal)
      #   VENUE_API_KEY_ID=<key id>              the read key's id
      #   VENUE_API_PRIVATE_KEY_PEM=<PKCS8 PEM>   the read key's private key; "\n" escapes accepted
      # Both:
      #   EVENT_SHADOW_POSITIONS_TTL_MS=20000    how long one read is reused
      # MEMBER APP (optional; the one-market-per-outcome venue's OAuth app, so a MEMBER of that venue
      # can connect their own account and lock in as their own partial sale into its book, in their
      # own account: nothing hedged, no credit, no take, no capital of ours. The member's surface is
      # the service's own hosted page, GET /app (the venue's skin, the demo's Lock in line; nothing to
      # install): its session is a cookie the service sets (HttpOnly, SameSite=Lax, Secure behind
      # https, 180 days) and the member's holder alias is a hash of it, m-<16 hex>, so no secret is
      # in a ledger file name. Cookie callers are a member-only lane: positions never read our own
      # venue keys, quote/lock refuse any venue but this one (403 member_only), POSTs need the page's
      # x-member-app: 1 header. The extension's STX card is the optional second surface. Neither holds
      # a token; the service does, sealed. Register a Web app at the venue's developer portal with the
      # callback below and the service's egress IP on the app's allow-list for the write scope. Set in
      # the dashboard, never in git. Unset: the member routes answer 404 member_app_off, /app says the
      # service is not set up for it, and the extension's STX card says the same. Needs
      # EVENT_SHADOW_LOCK_KEY.)
      #   MEMBER_APP_HOST=https://demo....       the venue's API host (also its authorize and token host)
      #   MEMBER_APP_CLIENT_ID=<app client id>
      #   MEMBER_APP_CLIENT_SECRET=<app client secret>   client_secret_basic on the token exchange
      #   MEMBER_APP_TOKEN_KEY=<32 bytes, 64 hex or base64>  seals the members' tokens on disk (AES-GCM);
      #                                         lose it and every member connects again, nothing else
      #   MEMBER_APP_REDIRECT_URI=...            optional; default RECORD_URL + /api/shadow/member/callback,
      #                                         which must be the callback registered on the app, exactly
      #   MEMBER_APP_TOKENS_PATH=...             optional; default member-tokens.json beside the lock ledger
      #   MEMBER_APP_SCOPES=...                  optional; default "profile.read balance.read portfolio.read orders.read orders.write"
      #                                         (balance.read must be ticked on the app's registration; a member who
      #                                         connected before it was asked sees "Reconnect to show it" on the page)
      #   MEMBER_APP_VENUE_URL=https://...       optional; the venue's web app (e.g. https://demo.stxapp.io): the page's
      #                                         Back to STX pill, the venue mark's link, and the Games tab's Buy on STX
      #                                         links to <url>/events/<event_id> (unset: no links, the rows still show)
      #   MEMBER_APP_HOSTNAME=stx.earnandprotect.xyz
      #                                         optional; the page's own host, a custom domain on this same service
      #                                         (Render: Settings → Custom Domains → add it; a CNAME at the registrar to
      #                                         the service's onrender host; Render issues the certificate). On that host
      #                                         / is the page, /app/* and /api/* answer as always, and every other path
      #                                         (the record, the embed, the operator views) is sent to RECORD_URL, so
      #                                         nothing venue-neutral is served under a venue's name. The venue sees the
      #                                         same callback either way (it is RECORD_URL's), so nothing changes on the
      #                                         app registration. Unset: the page lives at RECORD_URL/app only.
      #   MEMBER_APP_CONTACT=you@example.com     optional; named on the privacy page (/privacy on the page's host,
      #                                         /app/privacy anywhere) as who to write to for removal; the page
      #                                         is what the venue's app registration asks for as the privacy URL
      #   MEMBER_APP_ORDER_WAIT_MS=3000          optional; how long a member's limit order rests before
      #                                         the rest is cancelled and the record written from the fills
      #   MEMBER_APP_IN_PLAY=0                   optional; on by default. On: a member may lock while the
      #                                         game is on and the pre-game cutoff does not apply; the
      #                                         order rests the market's in_play_delay_sec longer so it
      #                                         outlives the venue's hold. 0 makes the page pre-game only.
      #   MEMBER_APP_COMBO_RFQ=auto              optional; auto is the default (unset is auto). A member's
      #                                         combo (parlay) ticket is quoted and partly sold through
      #                                         the venue's request-for-quote at ANY leg, not only the
      #                                         last, wherever the venue quotes. Auto finds out for
      #                                         itself: when a member holds a live combo the service asks
      #                                         the venue's quote path for a bid on it, in the background.
      #                                         A well-formed answer turns the combo rows on for everyone;
      #                                         a 404 (the venue has not shipped the path, as today)
      #                                         leaves them riding to settlement and is asked again half
      #                                         an hour later. Nothing to switch on the day it ships.
      #                                         No leave early on a combo; the record settles on the
      #                                         venue's own word for the combo market. The path's shape
      #                                         in memberApp.ts is still ASSUMED: if the venue ships it
      #                                         with other field names the rows stay off until the client
      #                                         is fitted, and the accept is proven only by the first
      #                                         tap. Before real money: one combo on the venue's paper
      #                                         exchange, and the three open questions in
      #                                         demo/event-lockin-extension/README.md (Combos) answered.
      #                                         Status: the operator's /healthz, lock.member.comboRfq (mode, live,
      #                                         path, checkedAt, why).
      #                                         =1 forces it on without asking; =0 forces it off.
      #                                         =preview: the combo rows quote from a stand-in bid, said
      #                                         to be a preview on the page, nothing asked of the venue,
      #                                         the tap refused in words (combo_preview); for seeing the
      #                                         flow on the deployed page before the venue quotes
      #   MEMBER_APP_COMPARE_WAIT_MS=4000        optional; the bound on the background comparison priced
      #                                         on the hedge routes beside the member's sale (0 turns it
      #                                         off); priced, nothing sent, written as memberSale.compared
      #   The competition map is REFERENCE_BOOK_OUTCOME_COMPETITIONS (shared with the reference read).
      # Operator (admin token): GET /api/shadow/member/raw?holder=<alias> is one member's venue account as the
      #   wire gives it (positions unfiltered, the markets for their ids and which were missing, probes of
      #   paths the docs do not settle, the listing books), for fitting the reader to the real venue.
      # Routes (lock key, or the page's cookie): GET /app (the hosted page; sets the cookie once;
      #   /app/stx.png, bird.png, atticus.png, icon-*.png and manifest.webmanifest are its files),
      #   GET /api/shadow/member (state: connected, handle, avatarUrl, scope),
      #   GET /api/shadow/member/account (handle, avatar, balance in cents, balanceScope; ?fresh=1),
      #   GET /api/shadow/member/games (protectable games the venue lists, joined by club and date,
      #   with the venue's market and event id, best bid, the Max floor keep, held; the competition
      #   catalogue is shared and kept 45 s), GET /api/shadow/member/history (every lock, newest first),
      #   GET /api/shadow/member/connect (the authorize URL to open),
      #   GET /api/shadow/member/callback (keyless; the venue's redirect, one-time state; a page
      #   member is sent back to /app?connected=1 or /app?error=...),
      #   POST /api/shadow/member/disconnect (revokes). /api/shadow/positions lists the member's longs
      #   with venue:"stx" (the protectable ones with their ticker; the rest with a reason: parlay,
      #   market_not_covered, league_not_covered, no_protectable_market) and cutoffMinutes;
      #   /api/shadow/quote?venue=stx prices the three tiers from the
      #   member's own bid depth; /api/shadow/lock on that venue is one limit sell to its fills;
      #   /api/shadow/unwind buys the contracts back. Status: healthz lock.member, never a token.
      # REFERENCE BOOKS (optional; other regulated US exchanges listing the same games, read on every
      # sports open so the record carries what the default tier would have cost hedged there. Price
      # reference only: never picks the route, never changes the quote, nothing is filled. The public
      # page calls them "reference book A" (signed API) and "reference book B" (partner API); the
      # record carries the dialect ids signed_v3 and partner_mm, never a venue name. Set in the
      # dashboard, never in git. Unset: no reference is read. Either may be set alone.
      # Signed venue. Its catalog and books are PUBLIC, so the host alone turns the reference on
      # (unsigned reads of /v3/public/catalog); the key is optional and only switches the reads to
      # the signed, account-scoped paths:
      #   REFERENCE_BOOK_SIGNED_HOST=https://api....   the venue's API host, nothing else needed
      #   REFERENCE_BOOK_SIGNED_KEY_ID=<key id>          optional, with the PEM
      #   REFERENCE_BOOK_SIGNED_PRIVATE_KEY_PEM=<PKCS8 PEM>
      #   A key the venue's account-scoped catalog refuses (423 ACCOUNT_LOCKED, 401, 403) is not
      #   fatal: catalog and book reads fall back to the public catalog for one cache window and
      #   /api/shadow/venues/catalog says so in `note`. Positions have no public path.
      #   REFERENCE_BOOK_SIGNED_LEAGUES=nba=<venue's word>  optional; a league the venue files under
      #     another word (read it off /api/shadow/venues/catalog?league=nba, leaguesSeen). Unset, a
      #     league that lists nothing under our code is searched once more on the unfiltered page.
      # Partner venue (same account key pair kind as above; only login, tournaments, events and
      # markets are read; dedicated pair, revoke when done):
      #   REFERENCE_BOOK_BEARER_HOST=https://cash.api..../partner
      #   REFERENCE_BOOK_BEARER_ACCESS_KEY=<access key>
      #   REFERENCE_BOOK_BEARER_SECRET_KEY=<secret key>
      # One-market-per-outcome venue (dialect id outcome_v1, public word "reference book D"; only
      # GET /api/v1/markets is read; it publishes nothing unauthenticated, so the host alone is a
      # note). Its demo exchange is a paper book with no money on it: point the host there until
      # its US production host opens. EITHER a read-only signed key (Ed25519; mint it under the
      # account's API keys with read scope only) OR an app registered for market data:
      #   REFERENCE_BOOK_OUTCOME_HOST=https://demo....          the venue's API host
      #   REFERENCE_BOOK_OUTCOME_KEY_ID=<key id>                 with the PEM
      #   REFERENCE_BOOK_OUTCOME_PRIVATE_KEY_PEM=<PKCS8 PEM>     "\n" escapes accepted
      #   REFERENCE_BOOK_OUTCOME_CLIENT_ID=<app client id>       or: with the secret; token fetched
      #   REFERENCE_BOOK_OUTCOME_CLIENT_SECRET=<app client secret>   and reused for its hour
      #   REFERENCE_BOOK_OUTCOME_COMPETITIONS=nba=NBA             optional; a league the venue files
      #     under another competition code (read it off /api/shadow/venues/catalog?league=nba)
      #   REFERENCE_BOOK_OUTCOME_MAX_PAGES=10                     optional; pages of 200 per competition
      #     read. The venue lists 60+ markets a game, so a full NFL week passes 1,000; the catalog
      #     probe's note says when the cap stopped a list short.
      # POLYMARKET US (dialect id long_short_v1, public word "reference book E"; operator column
      # "Polymarket US"). The US exchange, not the international one the `polymarket` hedge route
      # sends to. One market a game with a long side and a short side; its taker fee is folded
      # into every price. Set both in the dashboard (Environment → Add Environment Variable),
      # never in git, never in a chat:
      #   POLYMARKET_US_KEY_ID=<key id>            from the venue's developer portal
      #   POLYMARKET_US_SECRET_KEY=<secret key>    shown once beside the key id; base64
      #   With the pair set, each game's book comes off the venue's LIVE stream (one signed
      #   connection; the book as it stands, at no cost against the rate limit) and the account's
      #   cash can be read. Without it (REFERENCE_BOOK_POLY_US=public) the book is the venue's
      #   public REST copy: up to 30 seconds old (its age is on every read), and the venue allows
      #   one address about ten reads in ten seconds, so on a full slate each game's book is
      #   refreshed every minute or two. Good enough to compare prices before a game on a short
      #   list; not for one under way.
      #   REFERENCE_BOOK_POLY_US=0                 optional; turns the venue off whatever else is set
      #   POLYMARKET_US_STREAM=0                   optional; keeps the key for the account, books over REST only
      #   Check after adding (operator): GET /api/shadow/polymarket-us/preflight says in
      #   words whether the key was accepted, the cash, and whether the books are live.
      #   NOTHING HERE SENDS AN ORDER to this venue. It is a price reference: read on every sports
      #   quote, recorded, never the route. Hedging there is a later change (its settlement rule
      #   table per league, its order signer, one verified fill). The key can trade, so: a
      #   dedicated key for this service, and never on atticus-btc-curve.
      # Status: the operator state's hedge.referenceBooks lists which are configured, never the keys.
      # AGGREGATOR FEED (optional; the cross-venue data partner's signed API and orderbook stream).
      # With the key set, every sports quote reads its books from the feed FIRST: the opposing
      # outcome on the second venue, our own market's No side, and the same outcome on the venues
      # this service has no direct read for (kept as "reference book B (via the aggregator)" /
      # "reference book C (via the aggregator)", ids aggregated_mm / aggregated_other). Whatever
      # the feed cannot supply for a pair is read from the venue directly, as before; a mapping
      # that disagrees with ours is never priced from. A DATA key is all this needs (it refuses
      # venue paths); the TRADE key that sends orders is AGGREGATOR_TRADE_* under LIVE HEDGE above.
      # Set in the dashboard, never in git. Unset: the venues are read directly, nothing changes.
      #   AGGREGATOR_KEY_ID=<key id>
      #   AGGREGATOR_PRIVATE_KEY_HEX=<64 hex seed, or a PKCS8 PEM>
      #   AGGREGATOR_API_HOST / AGGREGATOR_STREAM_URL   optional; default to the partner's hosts
      # Status: hedge.pricingSource (configured, reads, readsWithBooks, mappingMismatches, lastError), never the key.
      # REFERENCE PRINTS (optional; a regulated US exchange that publishes no live book, only every
      # trade it matched the day before, in the CFTC's public reporting format, as a public file).
      # On every sports open the record keeps the opposing side's last print there, its size and
      # its age, beside the price the live hedge paid. Never priced as a route (a day-old print is
      # nothing a hedge could have been filled at), never touches the quote. The public page calls
      # it "reference prints C"; the record carries the id public_prints, never a venue name. No
      # credentials: the host alone turns it on. Unset: nothing is read.
      #   REFERENCE_PRINTS_HOST=https://cftc-public-reports....   the origin that serves /reporting/trade_data_YYYY-MM-DD.json.gz
      # Status: the operator state's hedge.referencePrints says whether it is on.

  - type: web
    name: atticus-pm-clob-egress-proxy
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventEgressProxy.ts
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - services/api/tests/**
        - .github/**
        - demo/**
        - services/api/src/**
        - services/api/scripts/btc*.ts
        - services/api/scripts/sportsVenuesReportService.ts
        - services/api/scripts/eventProtect*.ts
        - services/api/scripts/eventShadow*.ts
        - services/api/scripts/memberApp*.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM
        value: https://clob.polymarket.com
      - key: ALLOWED_PREFIXES
        value: /book
      # URL token — the only gate on the relay. Copy its generated value into the
      # operator machine's PM_CLOB_REST_BASE. Rotate by editing here.
      - key: PROXY_TOKEN
        generateValue: true
