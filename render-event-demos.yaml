# ─────────────────────────────────────────────────────────────────────────
# render-event-demos.yaml — the two Earn & Protect EVENT demos + a relay
#
# All three services are READ-ONLY demonstrations: no venue credentials, no
# wallets, public market-data endpoints only. Nothing here touches the live
# production Earn & Protect deploy (isolation: src/eventCollar/** only).
#
#   atticus-event-demo-btc          Tier 1: Kalshi BTC price event, hedged on
#                                   live OKX option books. Region singapore:
#                                   OKX is reliably reachable there (same
#                                   region as the existing OKX services).
#
#   atticus-event-demo-cross-venue  Tier 2: Kalshi sports market, hedged with
#                                   the SAME game on Polymarket. Region oregon:
#                                   Kalshi + Polymarket public APIs are proven
#                                   reachable from US networks.
#
#   atticus-btc-curve               Read-only BTC curve report: Kalshi and
#                                   Polymarket US strike ladders side by side
#                                   against the Deribit-implied distribution,
#                                   gaps over time, cost of latency, static vs
#                                   dynamic hedge replays, Lock in along the
#                                   hourly ladder. Region singapore (Deribit and
#                                   OKX reachable). Disk keeps the snapshots.
#                                   docs/btc-curve-report.md
#
#   atticus-sports-venues           Read-only sports venues report: the same
#                                   game's winner market on Kalshi, Polymarket
#                                   US and Novig side by side after fees, the
#                                   consensus and who sits off it, the cheapest
#                                   other side for every position, the crosses
#                                   that lock, gaps over time. Region oregon
#                                   (all three venues are US). Disk keeps the
#                                   snapshots. docs/sports-venues-report.md
#
#   (no service) /pairs on          BTC pairs UI for a trader: the same
#   atticus-btc-curve               contract on Kalshi and Polymarket US, the
#                                   15-minute up/down window, next close and
#                                   5 PM ET daily at the money and one strike
#                                   each way, scored for how cleanly both
#                                   quote it, the bands between strikes priced
#                                   against the venues and a realized-vol
#                                   model, the index's regime, one Launch
#                                   button per tenor that sends the picked pair
#                                   to his engine (POST) or opens his page with
#                                   it, JSON and a stream under /pairs/api/*.
#                                   10-second cycle inside the curve process,
#                                   so no second service is paid for.
#                                   docs/btc-pairs.md
#
#   atticus-pm-clob-egress-proxy    GET-only relay for clob.polymarket.com,
#                                   for operator machines whose ISP blocks it
#                                   (observed: silent connect timeouts). Local
#                                   use: PM_CLOB_REST_BASE=
#                                   https://<service>.onrender.com/t/<PROXY_TOKEN>
#                                   Holds no credentials; path allowlist /book.
#
# Deploy: Render dashboard → New → Blueprint → select this file on branch
# cursor/tier2-cross-venue-2bfa. autoDeploy keeps the demos on the branch tip.
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: atticus-event-demo-btc
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventProtectDemoService.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: atticus-btc-curve
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/btcCurveReportService.ts
    healthCheckPath: /healthz
    # One snapshot a minute is ~55 KB on disk; 21 days of retention is ~1.7 GB.
    disk:
      name: btc-curve-data
      mountPath: /var/data
      sizeGB: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: BTC_CURVE_DATA_DIR
        value: /var/data/btc-curve
      - key: BTC_CURVE_INTERVAL_SEC
        value: "60"
      - key: BTC_CURVE_RETAIN_DAYS
        value: "21"
      # Optional. When set, the page and JSON are only served with ?k=<token>
      # (an unlisted link for a reader). Set in the dashboard, not here.
      # - key: BTC_CURVE_TOKEN
      #   sync: false
      # The BTC pairs UI at /pairs runs inside this process (BTC_CURVE_PAIRS=0 turns it off).
      # Its gap history lives under the curve disk at /var/data/btc-curve/pairs.
      # - key: BTC_PAIRS_INTERVAL_SEC
      #   value: "10"
      # Optional. The trader's engine endpoint the Launch button sends to by default; he can
      # also set it on the page itself (kept in his browser). Set in the dashboard.
      # - key: BTC_PAIRS_LAUNCH_URL
      #   sync: false
      # Optional. "send" (default) POSTs the pair as JSON to that URL; "open" opens the URL in
      # a new tab with the pair in the query string, for an engine that is a screen he drives.
      # - key: BTC_PAIRS_LAUNCH_MODE
      #   value: send
      # Optional. Kalshi event page pattern once confirmed in a browser; {event} is the event
      # ticker in lower case (kxbtcd-26nov0917). Default is the KXBTCD series page.
      # - key: BTC_PAIRS_KALSHI_URL
      #   value: https://kalshi.com/markets/kxbtcd/bitcoin-price-abovebelow/{event}

  - type: web
    name: atticus-sports-venues
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/sportsVenuesReportService.ts
    healthCheckPath: /healthz
    # One snapshot a minute is ~40 KB on disk with a full slate; 21 days is ~1.2 GB.
    disk:
      name: sports-venues-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPORTS_VENUES_DATA_DIR
        value: /var/data/sports-venues
      - key: SPORTS_VENUES_INTERVAL_SEC
        value: "60"
      - key: SPORTS_VENUES_RETAIN_DAYS
        value: "21"
      # Optional. When set, the page and JSON are only served with ?k=<token>
      # (an unlisted link for a reader). Set in the dashboard, not here.
      # - key: SPORTS_VENUES_TOKEN
      #   sync: false

  - type: web
    name: atticus-event-demo-cross-venue
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventProtectXDemoService.ts
    healthCheckPath: /healthz
    # Funnel counters and the quote-receipts ledger live on a small disk so a
    # deploy does not zero them (without it both restart from /tmp, empty).
    disk:
      name: event-demo-cross-venue-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Gates GET /api/admin/funnel (read with ?token=... or x-admin-token).
      - key: EVENT_X_ADMIN_TOKEN
        generateValue: true
      - key: EVENT_X_FUNNEL_PATH
        value: /var/data/event-demo-funnel.json
      - key: EVENT_X_LEDGER_PATH
        value: /var/data/cross-quotes.jsonl
      # Ceiling on protection's cost in bps of expected value; above it the
      # cheapest route is still rich insurance and the scan refuses honestly
      # (protection_too_rich). 0 turns the ceiling off.
      - key: EVENT_X_MAX_EV_COST_BPS
        value: "300"
      # Minimum credit a tier must pay to be offered: 25¢ and 0.25% of stake,
      # whichever is more (38¢ on 150 contracts). Below it the scan refuses
      # (credit_too_small) rather than offering pennies. Applied in the scan, so
      # the board, the embed and the shadow record agree.
      - key: EVENT_X_MIN_CREDIT_CENTS
        value: "25"
      - key: EVENT_X_MIN_CREDIT_BPS
        value: "25"
      # In play: a game that has started stays on the board and is quoted from the books as
      # they stand, for EVENT_X_IN_PLAY_HOURS after tip-off (default 4). The row says Live in
      # place of the tip-off and re-prices while its panel is open. On unless this says 0
      # (false, no, off). The shadow record's lock path (the other service, same module) reads
      # the same switch from its own environment and is on by default there too.
      - key: EVENT_X_IN_PLAY
        value: "1"
      # Which hedge venues are offered tonight (kalshi, prophetx, novig, polymarket; comma
      # separated). A venue left out is not priced, not shown in the Venue view and never sent
      # to. Unset, every route is offered, which puts Polymarket on the board; the demo shows
      # Kalshi, ProphetX and Novig.
      - key: EVENT_HEDGE_VENUES
        value: "kalshi,prophetx,novig"
      # Whether the public page names the venues the other side is priced on and routed to,
      # and the routing partner. Unset (the default), the page says "best of 3 venues", the
      # Venue view letters them (Venue A, B, C; a host that is itself one of them keeps its
      # name), the recording's caption and the footer stop naming venues, and the Parlays tab
      # drops the lock's venue word. Everything is still tracked and named on the ledger, the
      # receipts and the operator surfaces. Set to "1" to name them on the page again.
      # - key: EVENT_X_NAME_HEDGE_VENUES
      #   value: "1"
      # NOVIG BOOK. The Novig route prices from the venue's own market, read as the signed-dialect
      # reference book (the same read atticus-event-shadow calls "reference book A"). Without a
      # host the route is offered but every row reads "not read". The catalog and books are
      # PUBLIC, so the host alone turns the read on; the key pair is optional and only switches
      # the reads to the account-scoped paths. Set in the dashboard, never in git; copy the
      # values from atticus-event-shadow (Render does not share env between services).
      #   REFERENCE_BOOK_SIGNED_HOST=https://api....   the venue's API host, nothing else needed
      #   REFERENCE_BOOK_SIGNED_KEY_ID=<key id>          optional, with the PEM
      #   REFERENCE_BOOK_SIGNED_PRIVATE_KEY_PEM=<PKCS8 PEM>
      #   REFERENCE_BOOK_SIGNED_LEAGUES=nba=<venue's word>  optional; copy if the shadow sets it
      # With no REFERENCE_BOOK_SIGNED_HOST the route falls back to VENUE_API_HOST when that is set.
      - key: REFERENCE_BOOK_SIGNED_HOST
        sync: false
      # POLYMARKET US BOOK (the US exchange; a price reference beside each quote, never the route,
      # no order is sent). Optional here: atticus-event-shadow is where the record is kept. To
      # have this board read it too, set the same pair in this service's dashboard, never in git:
      #   POLYMARKET_US_KEY_ID / POLYMARKET_US_SECRET_KEY   live books off the venue's stream
      #   REFERENCE_BOOK_POLY_US=public                     or: no key, the public copy (up to 30 s old)
      # Details under POLYMARKET US on atticus-event-shadow below.
      # Embed demo (/): host names honoured on ?brand=, comma-separated; anything
      # else renders as EVENT_X_EMBED_BRAND. These names carry a colourway and a
      # light/dark shell (scripts/eventProtectEmbedHtml.ts BRAND_PRESETS); any
      # other allowlisted name gets the generic slate palette. Sportsbook presets
      # hide the crypto strikes (?kind=all shows them). Partner console
      # (/partner, operator token) shows the host's revenue share at this percent.
      - key: EVENT_X_BRAND_ALLOWLIST
        value: "ProphetX,Novig,Sporttrade,Kalshi,Polymarket,DraftKings,FanDuel,PrizePicks,Underdog,Robinhood,Coinbase,Kraken,WagerWire,Wire Markets"
      # What the front door (/) calls the host when the link carries no ?brand=.
      - key: EVENT_X_EMBED_BRAND
        value: "Your Exchange"
      # A branded shell (?brand=Wire Markets) links its "record" to that venue's slate on
      # the shadow service, /slate/<slug>?k=<derived key>, instead of the full public
      # record. The derived key is HMAC(EVENT_SHADOW_SLATE_KEY, slug), so this must be
      # the SAME value as EVENT_SHADOW_SLATE_KEY on atticus-event-shadow (copy it by
      # hand in the dashboard; Render does not share generated values across
      # services). Unset, branded shells fall back to the full public record.
      - key: EVENT_SHADOW_SLATE_KEY
        sync: false
      # Where the public /partner page's "Talk to us" goes.
      - key: EVENT_X_CONTACT_EMAIL
        value: "michael@atticustrade.com"
      - key: EVENT_X_PARTNER_SHARE_PCT
        value: "50"

  # Shadow run: the cross-venue router quoted continuously, every position
  # marked against official results as events settle. The persistent disk is
  # the point — the track record must survive deploys. Read-only like the
  # demos: public market data only, nothing is bought.
  - type: web
    name: atticus-event-shadow
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventShadowWorker.ts
    healthCheckPath: /healthz
    disk:
      name: event-shadow-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVENT_SHADOW_LEDGER_PATH
        value: /var/data/event-shadow-ledger.jsonl
      # The shadow scans with the demo's scanner, so the same EV-cost ceiling applies:
      # rows above it are recorded as protection_too_rich refusals, not opened.
      - key: EVENT_X_MAX_EV_COST_BPS
        value: "300"
      # PINNED EXECUTION. A lock on a ticker armed for live orders is pinned to the venue the
      # executor can send to (Kalshi's own No side), while the engine still prices both routes.
      # Unset, the pinned route is judged on its own cost and a lock refuses as too_expensive
      # whenever Polymarket would have been the cheaper hedge (most NBA nights at small size).
      # Set to a whole number of cents, the lock stands when the holder's floor, cap and credit on
      # Kalshi are each within that many cents of the cheaper route's (0 = equal or better): the
      # holder is offered the same deal they would get anywhere, the ceiling judges the cheaper
      # route's cost, and the execution premium is ours, disclosed on the operator's quote as
      # routing.pinnedExecution. Terms worse than the tolerance stay refused.
      # 5: measured on the Oct 27 Pistons-Knicks game at 15 and 25 contracts, Kalshi's terms sit
      # 1c under on the cap and 5c under on the credit (Knicks), 5c under on the floor (Pistons);
      # 4 refuses both, 5 stands both. Premium absorbed: 155 and 280 bps of a $15-$25 stake.
      - key: EVENT_X_PINNED_TOLERANCE_CENTS
        value: "5"
      # Open mix: crypto strikes roll over hourly and would fill the record (3 of 4 opens on the
      # first book). The product lives on game positions, so crypto is held to a quarter of the
      # trailing day's opens, with a small allowance so an overnight book with no games still
      # records something.
      - key: EVENT_SHADOW_CRYPTO_SHARE_MAX
        value: "0.25"
      - key: EVENT_SHADOW_CRYPTO_FLOOR_PER_DAY
        value: "2"
      # Early closes: this share of positions leave before the lock, priced as a new trade at
      # the live books that second (both legs sold into the bids). The record then shows what
      # leaving early paid against holding, and what crossing the books cost against the mid.
      # 0 disables. The draw is a hash of the ticker, so a redeploy replays the same schedule.
      - key: EVENT_SHADOW_EARLY_CLOSE_SHARE_PCT
        value: "20"
      # Last leg of a parlay: a second ledger on the same disk. Simulated tickets of 2 to 5
      # favourites from Polymarket's combo leg catalog (there is no public list of real
      # tickets), real results and real books. When every earlier leg has hit, the compressed
      # position on the last leg is priced with the same collar search and the terms are
      # recorded once; nothing is bought. Defaults: $20 stake, 10-minute tick. EVENT_LASTLEG_ENABLED=0
      # turns it off. Public: the lock-sell-hold card on the record and /api/shadow/parlays (retail
      # shape; the demo's Parlays tab reads it). Operator views: /api/shadow/lastleg{,.csv}.
      - key: EVENT_LASTLEG_LEDGER_PATH
        value: /var/data/event-shadow-lastleg.jsonl
      # Ceiling on undecided tickets per size (2, 3, 4 and 5 legs). The default of two kept the
      # record to eight tickets in play; the Parlays tab is a positions list, so five per size
      # gives it up to twenty rows across the week's slate while staying under EVENT_LASTLEG_MAX_OPEN.
      - key: EVENT_LASTLEG_TICKETS_PER_SIZE
        value: "5"
      # No game on more than three undecided tickets at once (EVENT_LASTLEG_MAX_PER_GAME, default 3):
      # the biggest market would otherwise sit on every ticket and one upset would bust the whole board.
      # Venue slates: the record cut to one venue's leagues with its name on the page, at
      # /slate/<slug>?k=<EVENT_SHADOW_SLATE_KEY> (and /slate/<slug>.csv). One slate per
      # semicolon, slug=Name:leagues; an empty league list is every sports league. Reached
      # only by the share key or the operator token, never linked from the public record, so a
      # prospect's name appears only on a link we chose to send. Nothing is read from the venue.
      # A share link says how many hedge venues compete ("the best of 3 venues") and never which;
      # the operator token reads the names. EVENT_X_NAME_HEDGE_VENUES=1 on this service (the same
      # switch the demo page has, off by default) names them on share links too.
      - key: EVENT_SHADOW_SLATES
        value: "wiremarkets=Wire Markets:nfl,nba,mlb,nhl,epl,ucl,mls;wagerwire=WagerWire:nfl,nba,mlb,nhl;sporttrade=Sporttrade:nfl,nba,mlb,nhl;novig=Novig:nfl,nba,mlb,nhl;draftkings=DraftKings:nfl,nba,mlb,nhl;underdog=Underdog:nfl,nba,mlb,nhl;prophetx=ProphetX:nfl,nba,mlb,nhl,epl,ucl,mls;prizepicks=PrizePicks:nfl,nba,mlb,nhl"
      - key: EVENT_SHADOW_SLATE_KEY
        generateValue: true
      # Where the slate page's "Open the demo" goes (renders in the venue's brand with ?brand=).
      - key: EVENT_SHADOW_DEMO_URL
        value: https://atticus-event-demo-cross-venue.onrender.com
      # Gates the operator views: /report, /api/shadow/report, /api/shadow/hedges,
      # /api/shadow/lastleg, /api/shadow/export and the full positions CSV (?token=... or x-admin-token).
      # Fail-closed: without it those routes answer 403 and the public record stays up.
      - key: EVENT_X_ADMIN_TOKEN
        generateValue: true
      # Polymarket Builders Program attribution. This is the PUBLIC bytes32 Builder Code
      # (0x + 64 hex) from polymarket.com/settings?tab=builder, attached as `builderCode`
      # to every Polymarket order we place. Not the Builder API key: that is a UUID, is a
      # secret, is never put on an order, and is refused here with a healthz note if pasted
      # by mistake. The shadow (book mode) sends no orders, so this only takes effect once
      # EVENT_HEDGE_STRATEGY=rfq and POLY_* credentials are set. Public value, safe in git.
      - key: POLYMARKET_BUILDER_CODE
        value: "0x7c25351b760a956a2617e4574ba775190a0483944143b8f14e40733d1f5eff16"
      # LIVE HEDGE (off here; set in the dashboard for the live-order demo, never in git):
      #   EVENT_HEDGE_STRATEGY=live             real Kalshi orders behind rails; anything the
      #                                         rails hold is simulated at the book, reason on the receipt
      #   KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM   service env only; the extension never sees them
      #   EVENT_HEDGE_LIVE_TICKERS=KX...,KX...  allowlist; empty allows nothing
      #   EVENT_HEDGE_LIVE_MAX_CONTRACTS_PER_ORDER=25 / EVENT_HEDGE_LIVE_MAX_CONTRACTS_PER_DAY=100
      #   EVENT_HEDGE_LIVE_SEND=yes             the only value that sends; anything else is a dry run
      #   EVENT_HEDGE_KILL_SWITCH=1             nothing leaves, whatever else is set
      #   EVENT_HEDGE_LIVE_VIA=aggregator       the order goes through the aggregator's execution pod
      #                                         instead of our own Kalshi key: the pod holds a numbered
      #                                         Kalshi subaccount of ours, we sign with a TRADE key bound
      #                                         to that pod, and the hedge is on the partner's books as
      #                                         well as the venue's. Same rails, same dry run; the fill
      #                                         says via "aggregator". Default: direct.
      #   AGGREGATOR_TRADE_KEY_ID / AGGREGATOR_TRADE_PRIVATE_KEY_HEX   the TRADE key (not the DATA key below);
      #                                         generated in the partner's portal, private half here only
      # HEDGE FIRST (hedgeFirst.ts): when every setting above lets an order leave (live, the ticker
      #   armed, SEND=yes, no kill switch, a key for the venue), a tap buys the hedge BEFORE the lock is
      #   written, all or none. The whole hedge fills: the lock is written at the quoted terms. Nothing
      #   fills, or a cap holds the order: no lock, the holder is told to try again. A part fill or an
      #   order that errored after it left: no lock, and the alert sink is paged (kind hedge_stray) to
      #   look on the venue. Every attempt is two lines in lock-pending.jsonl beside the lock ledger
      #   (EVENT_SHADOW_LOCK_PENDING_PATH to move it). In a dry run nothing changes: the record is
      #   written and the fill is simulated at the book, as before.
      #   Operator: GET /api/shadow/lock/pending is the trail (attempts by ending, open lines, strays);
      #   POST /api/shadow/lock/pending/clear?id=...&note=... marks one checked. /healthz?token= carries
      #   lock.hedgeFirst: `unresolved` and `strays` must both read empty.
      # EXPOSURE CAPS (exposureCaps.ts): how much real money may be open at once. Read from the
      #   ledgers at each real-money lock, before the hedge order is built; a lock that would pass
      #   any of the three is refused with the cap and the amount, on one line in lock-pending.jsonl
      #   (type cap_refused). Simulated locks are not measured and not refused. Values are whole
      #   cents. Unset is the default below, never "no cap". The word `none` is the only way to
      #   say no cap, and /healthz then reads "no cap". Anything else that is not a whole number
      #   is the default, with a note in /healthz.
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_GAME=5000      default $50. Per game, both sides and
      #                                         every holder together: floors owed if the side loses,
      #                                         plus credits, plus what the hedges cost.
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_VENUE=10000    default $100. Per hedge venue: what the
      #                                         unsettled hedges bought there cost (cash resting there).
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_VENUE_KALSHI   optional, one venue's own cap in place of
      #   ..._PER_VENUE_NOVIG / _PROPHETX / _POLYMARKET      the one above (a new exchange capped lower).
      #                                         Default: unset, the venue takes the cap above.
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_HOLDER=5000    default $50. Per holder key: for each
      #                                         open lock the larger of what we can owe them (floor
      #                                         plus unpaid credit) and what they can owe us (the
      #                                         slice above the cap, handed back if their side wins).
      #   The defaults are sized for $5 to $20 positions: about $5 to $25 on the game per lock.
      #   Operator: /healthz?token= carries `exposure`: per game (the largest five), per venue and
      #   per holder, open now, the cap and the room left, and the refusals so far.
      # IN PLAY (lockWindow.ts): a game can be locked in from seven days out, through the last 45
      #   minutes and while it is being played. On by default.
      #   EVENT_X_IN_PLAY=0                     optional; turns it off (0, false, no, off): the lock path
      #                                         closes 45 minutes before the start, as it did before.
      #   EVENT_X_IN_PLAY_HOURS=4               optional; how long after the start a game stays open.
      #   EVENT_SHADOW_SCAN_IN_PLAY=1           optional, off by default: lets the automatic paper scan
      #                                         open records on games under way. Left off so the public
      #                                         record is not flattered by paper fills at a moving book.
      #   During a game the book moves between the read and the order. With real orders on, HEDGE
      #   FIRST is what makes that safe: a moved book fills nothing and locks nothing. In a dry run
      #   an in-play lock is a paper record at the book as read. A hedged lock cannot be left early
      #   once the game has started (the leave window still closes before the start); it settles.
      # Pre-flight (operator): GET /api/shadow/hedges/preflight?ticker=KX... reads balance and the rails
      #   (via aggregator: the pod's identity, its Kalshi cash and whether the key may trade).
      # The pod (operator): GET /api/shadow/hedges/pod reads the aggregator's side — pod, cash, positions,
      #   and every receipt on our trail that went that way. ?ticker= narrows the positions.
      # KALSHI ACCOUNT (operator; needs KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM, in any strategy):
      #   GET /api/shadow/kalshi/account                  API tier and grants, cash per shard, subaccounts per shard, the API keys, what to do next
      #   GET /api/shadow/kalshi/keys                     the API keys: id, name, which subaccount each is locked to, which one is ours
      #   Writes are a POST with a JSON body, or — from a browser tab with ?token= — a GET with confirm=yes and the fields in the query:
      #     /api/shadow/kalshi/account/upgrade?confirm=yes                      the permanent Advanced grant (Kalshi wants one API-created order among the last 100)
      #     /api/shadow/kalshi/subaccounts?confirm=yes&shard=0                  the next numbered subaccount on that shard (again with shard=3 for basketball)
      #     /api/shadow/kalshi/subaccounts/transfer?confirm=yes&from=0&to=1&cents=5000&shard=0     cash between subaccounts, one shard
      #     /api/shadow/kalshi/shards/transfer?confirm=yes&fromShard=0&toShard=3&cents=5000       the primary's cash across shards
      #     /api/shadow/kalshi/keys?confirm=yes&name=parlayx-pod&subaccount=1  mint a key restricted to that subaccount (omit subaccount for an
      #                                                                        unrestricted key; keyType=ed25519 optional). The private key is in
      #                                                                        that one answer and nowhere else: hand it to the pod at once.
      #     /api/shadow/kalshi/keys/delete?confirm=yes&id=…                     revoke a key (refuses the key this service signs with)
      #   Shards: Kalshi holds a subaccount's cash per matching engine; NFL is shard 0, basketball/baseball/
      #   tennis shard 3; a subaccount that hedges both needs cash on both. Nothing here places an order.
      # Resend (operator): POST /api/shadow/hedges/resend?ticker=KX... hedges an open lock again when
      #   its hedge never reached the venue (simulated fill on the trail); refuses once a live fill
      #   exists unless &force=1. Orders go to Kalshi's V2 path (POST /portfolio/events/orders).
      # Lock reset (operator): POST /api/shadow/lock/reset?ticker=KX... moves one lock's lines to an
      #   archive beside the lock ledger so the market can be locked again; names the live fills the
      #   venue still holds for the old lock. The holder's receipt: GET /api/shadow/receipt?ticker= (lock key).
      # LOCK IN (the tap from the browser extension; off here, set in the dashboard, never in git):
      #   EVENT_SHADOW_LOCK_KEY=<12+ chars>     opens GET /api/shadow/markets, GET /api/shadow/quote,
      #                                         GET /api/shadow/positions and POST /api/shadow/lock to
      #                                         callers sending x-lock-key.
      #                                         Unset: those routes answer 404 to anyone but the operator.
      #   Locks are written to their own ledger beside the scan's (lock-ledger.jsonl on the same
      #   disk; EVENT_SHADOW_LOCK_LEDGER_PATH to move it), so a holder may lock a market the scan
      #   already shows. Same settlement; never early-closed. Operator export: /api/shadow/export?ledger=lock
      #   Tickers on EVENT_HEDGE_LIVE_TICKERS are hedged on Kalshi's own No side and skipped by the scan.
      # HOLDER POSITIONS (optional; confirms what the holder has at the venue so the extension does not
      # have to read sizes off the page). Two venue APIs are spoken; the variables set pick one. Set in
      # the dashboard, never in git. Unset: /api/shadow/positions answers configured:false and the
      # extension reads the row from the page.
      # Bearer venue (partner API, session login; the venue issues the pair at Settings > Token. It is an
      # account key pair, so it could trade: dedicated pair, service env only, revoke after the recording.
      # The service only logs in and reads open plays, tournaments, events, markets):
      #   VENUE_API_HOST=https://cash.api..../partner   the partner API base, with the /partner path
      #   VENUE_API_ACCESS_KEY=<access key>
      #   VENUE_API_SECRET_KEY=<secret key>
      # Signed venue (read-only key minted with scripts/venueReadKey.ts; lists positions, nothing else):
      #   VENUE_API_HOST=https://api....         the venue's API host (paper host for a rehearsal)
      #   VENUE_API_KEY_ID=<key id>              the read key's id
      #   VENUE_API_PRIVATE_KEY_PEM=<PKCS8 PEM>   the read key's private key; "\n" escapes accepted
      # Both:
      #   EVENT_SHADOW_POSITIONS_TTL_MS=20000    how long one read is reused
      # MEMBER APP (optional; the one-market-per-outcome venue's OAuth app, so a MEMBER of that venue
      # can connect their own account and lock in as their own partial sale into its book, in their
      # own account: nothing hedged, no credit, no take, no capital of ours. The member's surface is
      # the service's own hosted page, GET /app (the venue's skin, the demo's Lock in line; nothing to
      # install): its session is a cookie the service sets (HttpOnly, SameSite=Lax, Secure behind
      # https, 180 days) and the member's holder alias is a hash of it, m-<16 hex>, so no secret is
      # in a ledger file name. Cookie callers are a member-only lane: positions never read our own
      # venue keys, quote/lock refuse any venue but this one (403 member_only), POSTs need the page's
      # x-member-app: 1 header. The extension's STX card is the optional second surface. Neither holds
      # a token; the service does, sealed. Register a Web app at the venue's developer portal with the
      # callback below and the service's egress IP on the app's allow-list for the write scope. Set in
      # the dashboard, never in git. Unset: the member routes answer 404 member_app_off, /app says the
      # service is not set up for it, and the extension's STX card says the same. Needs
      # EVENT_SHADOW_LOCK_KEY.)
      #   MEMBER_APP_HOST=https://demo....       the venue's API host (also its authorize and token host)
      #   MEMBER_APP_CLIENT_ID=<app client id>
      #   MEMBER_APP_CLIENT_SECRET=<app client secret>   client_secret_basic on the token exchange
      #   MEMBER_APP_TOKEN_KEY=<32 bytes, 64 hex or base64>  seals the members' tokens on disk (AES-GCM);
      #                                         lose it and every member connects again, nothing else
      #   MEMBER_APP_REDIRECT_URI=...            optional; default RECORD_URL + /api/shadow/member/callback,
      #                                         which must be the callback registered on the app, exactly
      #   MEMBER_APP_TOKENS_PATH=...             optional; default member-tokens.json beside the lock ledger
      #   MEMBER_APP_SCOPES=...                  optional; default "profile.read balance.read portfolio.read orders.read orders.write"
      #                                         (balance.read must be ticked on the app's registration; a member who
      #                                         connected before it was asked sees "Reconnect to show it" on the page)
      #   MEMBER_APP_VENUE_URL=https://...       optional; the venue's web app (e.g. https://demo.stxapp.io): the page's
      #                                         Back to STX pill, the venue mark's link, and the Games tab's Buy on STX
      #                                         links to <url>/events/<event_id> (unset: no links, the rows still show)
      #   MEMBER_APP_HOSTNAME=stx.earnandprotect.xyz
      #                                         optional; the page's own host, a custom domain on this same service
      #                                         (Render: Settings → Custom Domains → add it; a CNAME at the registrar to
      #                                         the service's onrender host; Render issues the certificate). On that host
      #                                         / is the page, /app/* and /api/* answer as always, and every other path
      #                                         (the record, the embed, the operator views) is sent to RECORD_URL, so
      #                                         nothing venue-neutral is served under a venue's name. The venue sees the
      #                                         same callback either way (it is RECORD_URL's), so nothing changes on the
      #                                         app registration. Unset: the page lives at RECORD_URL/app only.
      #   MEMBER_APP_CONTACT=you@example.com     optional; named on the privacy page (/privacy on the page's host,
      #                                         /app/privacy anywhere) as who to write to for removal; the page
      #                                         is what the venue's app registration asks for as the privacy URL
      #   MEMBER_APP_ORDER_WAIT_MS=3000          optional; how long a member's limit order rests before
      #                                         the rest is cancelled and the record written from the fills
      #   MEMBER_APP_IN_PLAY=0                   optional; on by default. On: a member may lock while the
      #                                         game is on and the pre-game cutoff does not apply; the
      #                                         order rests the market's in_play_delay_sec longer so it
      #                                         outlives the venue's hold. 0 makes the page pre-game only.
      #   MEMBER_APP_COMBO_RFQ=auto              optional; auto is the default (unset is auto). A member's
      #                                         combo (parlay) ticket is quoted and partly sold through
      #                                         the venue's request-for-quote at ANY leg, not only the
      #                                         last, wherever the venue quotes. Auto finds out for
      #                                         itself: when a member holds a live combo the service asks
      #                                         the venue's quote path for a bid on it, in the background.
      #                                         A well-formed answer turns the combo rows on for everyone;
      #                                         a 404 (the venue has not shipped the path, as today)
      #                                         leaves them riding to settlement and is asked again half
      #                                         an hour later. Nothing to switch on the day it ships.
      #                                         No leave early on a combo; the record settles on the
      #                                         venue's own word for the combo market. The path's shape
      #                                         in memberApp.ts is still ASSUMED: if the venue ships it
      #                                         with other field names the rows stay off until the client
      #                                         is fitted, and the accept is proven only by the first
      #                                         tap. Before real money: one combo on the venue's paper
      #                                         exchange, and the three open questions in
      #                                         demo/event-lockin-extension/README.md (Combos) answered.
      #                                         Status: /healthz?token= lock.member.comboRfq (mode, live,
      #                                         path, checkedAt, why).
      #                                         =1 forces it on without asking; =0 forces it off.
      #                                         =preview: the combo rows quote from a stand-in bid, said
      #                                         to be a preview on the page, nothing asked of the venue,
      #                                         the tap refused in words (combo_preview); for seeing the
      #                                         flow on the deployed page before the venue quotes
      #   MEMBER_APP_COMPARE_WAIT_MS=4000        optional; the bound on the background comparison priced
      #                                         on the hedge routes beside the member's sale (0 turns it
      #                                         off); priced, nothing sent, written as memberSale.compared
      #   The competition map is REFERENCE_BOOK_OUTCOME_COMPETITIONS (shared with the reference read).
      # Operator (admin token): GET /api/shadow/member/raw?holder=<alias> is one member's venue account as the
      #   wire gives it (positions unfiltered, the markets for their ids and which were missing, probes of
      #   paths the docs do not settle, the listing books), for fitting the reader to the real venue.
      # Routes (lock key, or the page's cookie): GET /app (the hosted page; sets the cookie once;
      #   /app/stx.png, bird.png, atticus.png, icon-*.png and manifest.webmanifest are its files),
      #   GET /api/shadow/member (state: connected, handle, avatarUrl, scope),
      #   GET /api/shadow/member/account (handle, avatar, balance in cents, balanceScope; ?fresh=1),
      #   GET /api/shadow/member/games (protectable games the venue lists, joined by club and date,
      #   with the venue's market and event id, best bid, the Max floor keep, held; the competition
      #   catalogue is shared and kept 45 s), GET /api/shadow/member/history (every lock, newest first),
      #   GET /api/shadow/member/connect (the authorize URL to open),
      #   GET /api/shadow/member/callback (keyless; the venue's redirect, one-time state; a page
      #   member is sent back to /app?connected=1 or /app?error=...),
      #   POST /api/shadow/member/disconnect (revokes). /api/shadow/positions lists the member's longs
      #   with venue:"stx" (the protectable ones with their ticker; the rest with a reason: parlay,
      #   market_not_covered, league_not_covered, no_protectable_market) and cutoffMinutes;
      #   /api/shadow/quote?venue=stx prices the three tiers from the
      #   member's own bid depth; /api/shadow/lock on that venue is one limit sell to its fills;
      #   /api/shadow/unwind buys the contracts back. Status: healthz lock.member, never a token.
      # REFERENCE BOOKS (optional; other regulated US exchanges listing the same games, read on every
      # sports open so the record carries what the default tier would have cost hedged there. Price
      # reference only: never picks the route, never changes the quote, nothing is filled. The public
      # page calls them "reference book A" (signed API) and "reference book B" (partner API); the
      # record carries the dialect ids signed_v3 and partner_mm, never a venue name. Set in the
      # dashboard, never in git. Unset: no reference is read. Either may be set alone.
      # Signed venue. Its catalog and books are PUBLIC, so the host alone turns the reference on
      # (unsigned reads of /v3/public/catalog); the key is optional and only switches the reads to
      # the signed, account-scoped paths:
      #   REFERENCE_BOOK_SIGNED_HOST=https://api....   the venue's API host, nothing else needed
      #   REFERENCE_BOOK_SIGNED_KEY_ID=<key id>          optional, with the PEM
      #   REFERENCE_BOOK_SIGNED_PRIVATE_KEY_PEM=<PKCS8 PEM>
      #   A key the venue's account-scoped catalog refuses (423 ACCOUNT_LOCKED, 401, 403) is not
      #   fatal: catalog and book reads fall back to the public catalog for one cache window and
      #   /api/shadow/venues/catalog says so in `note`. Positions have no public path.
      #   REFERENCE_BOOK_SIGNED_LEAGUES=nba=<venue's word>  optional; a league the venue files under
      #     another word (read it off /api/shadow/venues/catalog?league=nba, leaguesSeen). Unset, a
      #     league that lists nothing under our code is searched once more on the unfiltered page.
      # Partner venue (same account key pair kind as above; only login, tournaments, events and
      # markets are read; dedicated pair, revoke when done):
      #   REFERENCE_BOOK_BEARER_HOST=https://cash.api..../partner
      #   REFERENCE_BOOK_BEARER_ACCESS_KEY=<access key>
      #   REFERENCE_BOOK_BEARER_SECRET_KEY=<secret key>
      # One-market-per-outcome venue (dialect id outcome_v1, public word "reference book D"; only
      # GET /api/v1/markets is read; it publishes nothing unauthenticated, so the host alone is a
      # note). Its demo exchange is a paper book with no money on it: point the host there until
      # its US production host opens. EITHER a read-only signed key (Ed25519; mint it under the
      # account's API keys with read scope only) OR an app registered for market data:
      #   REFERENCE_BOOK_OUTCOME_HOST=https://demo....          the venue's API host
      #   REFERENCE_BOOK_OUTCOME_KEY_ID=<key id>                 with the PEM
      #   REFERENCE_BOOK_OUTCOME_PRIVATE_KEY_PEM=<PKCS8 PEM>     "\n" escapes accepted
      #   REFERENCE_BOOK_OUTCOME_CLIENT_ID=<app client id>       or: with the secret; token fetched
      #   REFERENCE_BOOK_OUTCOME_CLIENT_SECRET=<app client secret>   and reused for its hour
      #   REFERENCE_BOOK_OUTCOME_COMPETITIONS=nba=NBA             optional; a league the venue files
      #     under another competition code (read it off /api/shadow/venues/catalog?league=nba)
      #   REFERENCE_BOOK_OUTCOME_MAX_PAGES=10                     optional; pages of 200 per competition
      #     read. The venue lists 60+ markets a game, so a full NFL week passes 1,000; the catalog
      #     probe's note says when the cap stopped a list short.
      # POLYMARKET US (dialect id long_short_v1, public word "reference book E"; operator column
      # "Polymarket US"). The US exchange, not the international one the `polymarket` hedge route
      # sends to. One market a game with a long side and a short side; its taker fee is folded
      # into every price. Set both in the dashboard (Environment → Add Environment Variable),
      # never in git, never in a chat:
      #   POLYMARKET_US_KEY_ID=<key id>            from the venue's developer portal
      #   POLYMARKET_US_SECRET_KEY=<secret key>    shown once beside the key id; base64
      #   With the pair set, each game's book comes off the venue's LIVE stream (one signed
      #   connection; the book as it stands, at no cost against the rate limit) and the account's
      #   cash can be read. Without it (REFERENCE_BOOK_POLY_US=public) the book is the venue's
      #   public REST copy: up to 30 seconds old (its age is on every read), and the venue allows
      #   one address about ten reads in ten seconds, so on a full slate each game's book is
      #   refreshed every minute or two. Good enough to compare prices before a game on a short
      #   list; not for one under way.
      #   REFERENCE_BOOK_POLY_US=0                 optional; turns the venue off whatever else is set
      #   POLYMARKET_US_STREAM=0                   optional; keeps the key for the account, books over REST only
      #   Check after adding (operator): GET /api/shadow/polymarket-us/preflight?token=... says in
      #   words whether the key was accepted, the cash, and whether the books are live.
      #   NOTHING HERE SENDS AN ORDER to this venue. It is a price reference: read on every sports
      #   quote, recorded, never the route. Hedging there is a later change (its settlement rule
      #   table per league, its order signer, one verified fill). The key can trade, so: a
      #   dedicated key for this service, and never on atticus-btc-curve or atticus-sports-venues.
      # Status: the operator state's hedge.referenceBooks lists which are configured, never the keys.
      # AGGREGATOR FEED (optional; the cross-venue data partner's signed API and orderbook stream).
      # With the key set, every sports quote reads its books from the feed FIRST: the opposing
      # outcome on the second venue, our own market's No side, and the same outcome on the venues
      # this service has no direct read for (kept as "reference book B (via the aggregator)" /
      # "reference book C (via the aggregator)", ids aggregated_mm / aggregated_other). Whatever
      # the feed cannot supply for a pair is read from the venue directly, as before; a mapping
      # that disagrees with ours is never priced from. A DATA key is all this needs (it refuses
      # venue paths); the TRADE key that sends orders is AGGREGATOR_TRADE_* under LIVE HEDGE above.
      # Set in the dashboard, never in git. Unset: the venues are read directly, nothing changes.
      #   AGGREGATOR_KEY_ID=<key id>
      #   AGGREGATOR_PRIVATE_KEY_HEX=<64 hex seed, or a PKCS8 PEM>
      #   AGGREGATOR_API_HOST / AGGREGATOR_STREAM_URL   optional; default to the partner's hosts
      # Status: hedge.pricingSource (configured, reads, readsWithBooks, mappingMismatches, lastError), never the key.
      # REFERENCE PRINTS (optional; a regulated US exchange that publishes no live book, only every
      # trade it matched the day before, in the CFTC's public reporting format, as a public file).
      # On every sports open the record keeps the opposing side's last print there, its size and
      # its age, beside the price the live hedge paid. Never priced as a route (a day-old print is
      # nothing a hedge could have been filled at), never touches the quote. The public page calls
      # it "reference prints C"; the record carries the id public_prints, never a venue name. No
      # credentials: the host alone turns it on. Unset: nothing is read.
      #   REFERENCE_PRINTS_HOST=https://cftc-public-reports....   the origin that serves /reporting/trade_data_YYYY-MM-DD.json.gz
      # Status: the operator state's hedge.referencePrints says whether it is on.

  - type: web
    name: atticus-pm-clob-egress-proxy
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventEgressProxy.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM
        value: https://clob.polymarket.com
      - key: ALLOWED_PREFIXES
        value: /book
      # URL token — the only gate on the relay. Copy its generated value into the
      # operator machine's PM_CLOB_REST_BASE. Rotate by editing here.
      - key: PROXY_TOKEN
        generateValue: true
