# ─────────────────────────────────────────────────────────────────────────
# render-event-demos.yaml: the Earn & Protect EVENT lane, five services
#
# FOUR ARE READ-ONLY. They read market data and serve pages. None of them
# places an order.
#
#   atticus-event-demo-btc          Tier 1 demo: a Kalshi BTC price event hedged
#                                   on live OKX option books. No credentials.
#   atticus-event-demo-cross-venue  Tier 2 demo: the public board and embed for
#                                   a Kalshi sports position. Quotes only.
#   atticus-btc-curve               BTC curve report, with the BTC pairs UI at
#                                   /pairs and the sports venues report (one
#                                   game on Kalshi, Polymarket US, Novig,
#                                   ProphetX and Crypto.com side by side) at
#                                   /sports, in one process.
#   atticus-pm-clob-egress-proxy    GET-only relay for clob.polymarket.com.
#                                   Holds no credentials.
#
# ONE HOLDS VENUE CREDENTIALS AND CAN SEND REAL ORDERS WHEN ARMED.
#
#   atticus-event-shadow            The public track record, the lock path the
#                                   browser extension and the member page call,
#                                   and the operator views. Its disk holds the
#                                   only copy of the record and the lock ledgers.
#
#   As committed in this file it buys nothing: every hedge is filled on paper
#   at the book. The trading keys (Kalshi, Novig, the aggregator's TRADE key)
#   are set in the Render dashboard. A hedge order leaves only when all of
#   these hold at once:
#     EVENT_HEDGE_STRATEGY=live        anything else simulates every hedge
#     a key for the venue is present   Kalshi direct, or the aggregator's pod
#                                      with EVENT_HEDGE_LIVE_VIA=aggregator;
#                                      Novig with its own trading key
#     EVENT_HEDGE_LIVE_TICKERS         names the ticker; empty allows nothing,
#                                      * allows any ticker the engine priced
#     the per-order and per-day caps   both have room for the order
#     EVENT_HEDGE_LIVE_SEND=yes        any other value is a dry run
#     EVENT_HEDGE_KILL_SWITCH          is off; set to 1, no hedge order and
#                                      no quote request leaves, in any
#                                      strategy, whatever else is set
#   Anything the rails hold back is simulated at the book, with the reason on
#   the receipt. Two more things on this service act on a real account: with
#   the member app set up (MEMBER_APP_*), a venue member who connects sells
#   part of their own position in their own account; and the operator routes
#   behind EVENT_X_ADMIN_TOKEN can move cash between our Kalshi subaccounts and
#   mint or revoke Kalshi API keys. The comments in its block below say how
#   each is switched on.
#
# SECRETS live only in the Render dashboard, never in git. This file carries
# public values, `generateValue` (Render makes the value) and `sync: false`
# (set by hand in the dashboard). None of the five signs for an on-chain
# address: the venues are reached with API keys only.
#
# DEPLOYS. Every service follows the tip of cursor/tier2-cross-venue-2bfa
# (autoDeploy), so every merge to that branch redeploys every service unless
# all the files the merge changed are on that service's
# buildFilter.ignoredPaths. A restart of atticus-event-shadow interrupts the
# live lock path, so its filter matters most. The rule for the filters is
# written above the first one, and a test guards them.
#
# ISOLATION. Nothing here touches the live production Earn & Protect deploy:
# the five start scripts load only services/api/scripts and, under
# services/api/src, eventCollar, btcCurve and sportsVenues.
#
# THE SERVICES IN MORE DETAIL
#
#   atticus-event-demo-btc          Tier 1: Kalshi BTC price event, hedged on
#                                   live OKX option books. Region singapore:
#                                   OKX is reliably reachable there (same
#                                   region as the existing OKX services).
#
#   atticus-event-demo-cross-venue  Tier 2: Kalshi sports market, hedged with
#                                   the SAME game on the venues named in
#                                   EVENT_HEDGE_VENUES (Kalshi, ProphetX and
#                                   Novig as committed; unset, every route is
#                                   offered, Polymarket included). Region
#                                   oregon: Kalshi + Polymarket public APIs are
#                                   proven reachable from US networks. Disk
#                                   keeps the funnel counters and the quote
#                                   receipts. Carries an operator token, the
#                                   slate key and, when set in the dashboard,
#                                   a read key for the Novig book; nothing
#                                   that sends an order.
#
#   atticus-event-shadow            The shadow run: the cross-venue router
#                                   quoted continuously, every position marked
#                                   against official results as events settle,
#                                   kept on an append-only ledger. Serves the
#                                   public record, the venue slates, the
#                                   parlay record, Lock in (the extension's
#                                   tap and the member page at /app) and the
#                                   operator views, the ledger export among
#                                   them. Region oregon. Disk keeps the
#                                   ledgers; they must survive deploys.
#
#   atticus-btc-curve               Read-only BTC curve report: Kalshi and
#                                   Polymarket US strike ladders side by side
#                                   against the Deribit-implied distribution,
#                                   gaps over time, cost of latency, static vs
#                                   dynamic hedge replays, Lock in along the
#                                   hourly ladder. Region singapore (Deribit and
#                                   OKX reachable). Disk keeps the snapshots.
#                                   docs/btc-curve-report.md
#
#   (no service) /sports on         Read-only sports venues report: the same
#   atticus-btc-curve               game's winner market on Kalshi, Polymarket
#                                   US, Novig, ProphetX and Crypto.com side by side after fees, the
#                                   consensus and who sits off it, the cheapest
#                                   other side for every position, the crosses
#                                   that lock, gaps over time. 60-second cycle
#                                   inside the curve process, behind the same
#                                   key, so no second service is paid for; its
#                                   snapshots sit on the curve disk. It was
#                                   never deployed as a service of its own.
#                                   The trade tape of Crypto.com's exchange is
#                                   kept per game on the same disk. Lock in
#                                   replayed on it is NOT under this key: it is
#                                   a page for one reader at /prospect, under
#                                   PROSPECT_PAGE_KEY (below).
#                                   docs/sports-venues-report.md
#
#   (no service) /pairs on          BTC pairs UI for a trader: the same
#   atticus-btc-curve               contract on Kalshi and Polymarket US, the
#                                   15-minute up/down window, next close and
#                                   5 PM ET daily at the money and one strike
#                                   each way, scored for how cleanly both
#                                   quote it, the bands between strikes priced
#                                   against the venues and a realized-vol
#                                   model, the index's regime, one Launch
#                                   button per tenor that sends the picked pair
#                                   to his engine (POST) or opens his page with
#                                   it, JSON and a stream under /pairs/api/*.
#                                   10-second cycle inside the curve process,
#                                   so no second service is paid for.
#                                   docs/btc-pairs.md
#
#   atticus-pm-clob-egress-proxy    GET-only relay for clob.polymarket.com,
#                                   for operator machines whose ISP blocks it
#                                   (observed: silent connect timeouts). Local
#                                   use: PM_CLOB_REST_BASE=
#                                   https://<service>.onrender.com/t/<PROXY_TOKEN>
#                                   Holds no credentials; path allowlist /book.
#
# Deploy: Render dashboard → New → Blueprint → select this file on branch
# cursor/tier2-cross-venue-2bfa.
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: atticus-event-demo-btc
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventProtectDemoService.ts
    healthCheckPath: /healthz
    # BUILD FILTERS. Every merge to the branch redeploys every service in this file
    # unless every file the merge changed is on that service's ignoredPaths. Only
    # ignoredPaths are used, never `paths`, so a new file nobody has thought about
    # always deploys: a needless restart costs less than a service that silently
    # stays stale. Ignored for every service: the docs, any Markdown file, the
    # tests, the GitHub workflows and the browser extensions under demo/ (no service
    # reads, serves or packs any of them). After those, each service ignores only
    # the source trees and scripts its start script does not import.
    # services/api/tests/eventDeployFilters.test.ts computes what each start script
    # imports and fails if an ignored path covers any of it, so check there before
    # adding a line. Render always acts on a change to this file itself.
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - services/api/tests/**
        - .github/**
        - demo/**
        - services/api/src/btcCurve/**
        - services/api/src/sportsVenues/**
        - services/api/src/eventCollar/crossVenue/**
        - services/api/scripts/btc*.ts
        - services/api/scripts/sportsVenuesReportService.ts
        - services/api/scripts/eventShadow*.ts
        - services/api/scripts/eventProtectX*.ts
        - services/api/scripts/eventProtectEmbedHtml.ts
        - services/api/scripts/memberApp*.ts
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: atticus-btc-curve
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/btcCurveReportService.ts
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - services/api/tests/**
        - .github/**
        - demo/**
        - services/api/scripts/event*.ts
        - services/api/scripts/memberApp*.ts
        - services/api/scripts/sportsVenuesReportService.ts
    # src/sportsVenues and src/eventCollar/crossVenue are not ignored here: the sports page at
    # /sports is in this process and its readers import the cross-venue team tables and venue
    # clients, so a change to either redeploys this service.
    #
    # What is kept: every day, forever. One file per UTC day for the curve snapshots
    # (snapshots-YYYY-MM-DD.jsonl) and, under pairs/, one for the 10-second pairs cycles
    # (gaps-...) and one for the lock episodes (episodes-...), and, under sports/, one for the
    # sports venues snapshots (snapshots-...). Nothing is deleted unless
    # BTC_CURVE_RETAIN_DAYS is set to a whole number of days. Unset, empty, 0, all and none
    # keep everything; a value that cannot be read keeps everything too and /healthz says so.
    #
    # The gzip step: one hour after a UTC day ends, its file is compressed to .jsonl.gz, one
    # file per hourly pass. The copy is checked against the original (bytes, line count,
    # sha256) before the original is removed; a failed pass leaves the original and tries
    # again. Everything that reads day files reads both forms.
    #
    # Growth, measured on 11 November 2026 by running this service locally:
    #   curve snapshot   215 KB raw, 31 KB gzipped, one a minute  = 310 MB a day raw, 45 MB gzipped
    #   pairs cycle      3.9 KB raw, one every 10 seconds         =  34 MB a day raw,  2 MB gzipped
    #   sports snapshot   65 KB raw, 10 KB gzipped, one a minute  =  94 MB a day raw, 15 MB gzipped
    # (a pairs cycle stores both books of every pair it priced, so a trade can be priced on a
    # later cycle; the sports figure is for 48 games listed, with the 14% the ProphetX listings
    # and the 30% the Crypto.com listings were measured to add, and grows with the slate).
    # Together about 440 MB a day raw, 62 MB gzipped. Without the gzip step this 3 GB disk would
    # be full in under 7 days; with it, it holds the current day raw plus about 41 closed days
    # (about 55 with BTC_CURVE_SPORTS=off). A year is about 23 GB: raise sizeGB to 25 before the
    # sixth week is out (Render disks only grow).
    #
    # Memory, measured on 11 November 2026 in a 512 MB, half CPU group with the full curve
    # window and a full sports window reloaded from disk, every page opened: see
    # docs/btc-curve-report.md. The sports page holds 24 hours of snapshots in memory here
    # (SPORTS_VENUES_WINDOW_HOURS), not the 72 it holds alone; the disk keeps every snapshot.
    #
    # The budget: BTC_CURVE_DISK_BUDGET_MB is the size /healthz measures the data against.
    # Past 80% it says so in plain words under data.warning and so does the start-up log line.
    # The budget never deletes anything. Keep it equal to the disk size when the disk is raised.
    #
    # IMPORTANT for the operator: if BTC_CURVE_RETAIN_DAYS is set to 21 in the Render dashboard
    # for this service (it was in this file until now), delete it there. A value in the
    # dashboard overrides the code default, and with it the service still deletes after 21 days.
    # Check /healthz afterwards: data.retention must read "all".
    disk:
      name: btc-curve-data
      mountPath: /var/data
      sizeGB: 3
    envVars:
      - key: NODE_ENV
        value: production
      - key: BTC_CURVE_DATA_DIR
        value: /var/data/btc-curve
      - key: BTC_CURVE_INTERVAL_SEC
        value: "60"
      - key: BTC_CURVE_DISK_BUDGET_MB
        value: "3000"
      # Optional. A whole number of days keeps that window and deletes older day files.
      # Leave it out to keep every day.
      # - key: BTC_CURVE_RETAIN_DAYS
      #   value: "365"
      # Optional. When set, the page and JSON are only served with ?k=<token>
      # (an unlisted link for a reader). Set in the dashboard, not here.
      # - key: BTC_CURVE_TOKEN
      #   sync: false
      # The BTC pairs UI at /pairs runs inside this process (BTC_CURVE_PAIRS=0 turns it off).
      # Its gap history lives under the curve disk at /var/data/btc-curve/pairs and follows
      # BTC_CURVE_RETAIN_DAYS unless BTC_PAIRS_RETAIN_DAYS is set (same values, same rule).
      # - key: BTC_PAIRS_RETAIN_DAYS
      #   value: "365"
      # - key: BTC_PAIRS_INTERVAL_SEC
      #   value: "10"
      # Optional. The trader's engine endpoint the Launch button sends to by default; he can
      # also set it on the page itself (kept in his browser). Set in the dashboard.
      # - key: BTC_PAIRS_LAUNCH_URL
      #   sync: false
      # Optional. "send" (default) POSTs the pair as JSON to that URL; "open" opens the URL in
      # a new tab with the pair in the query string, for an engine that is a screen he drives.
      # - key: BTC_PAIRS_LAUNCH_MODE
      #   value: send
      # Optional. Kalshi event page pattern once confirmed in a browser; {event} is the event
      # ticker in lower case (kxbtcd-26nov0917). Default is the KXBTCD series page.
      # - key: BTC_PAIRS_KALSHI_URL
      #   value: https://kalshi.com/markets/kxbtcd/bitcoin-price-abovebelow/{event}
      # The sports venues report at /sports runs inside this process, behind the same key
      # (BTC_CURVE_SPORTS=off turns it off). Its snapshots live under the curve disk at
      # /var/data/btc-curve/sports and follow BTC_CURVE_RETAIN_DAYS unless
      # SPORTS_VENUES_RETAIN_DAYS is set (same values, same rule). A sports fault is a line
      # under sports on /healthz; the BTC pages do not depend on it.
      # - key: BTC_CURVE_SPORTS
      #   value: "off"
      # The page made for one reader at /prospect (Lock in replayed on Crypto.com's real trades,
      # with every table at /prospect/detail). Its own key, which opens nothing else on this
      # service; BTC_CURVE_TOKEN does not open it. Unset, shorter than 16 characters, or equal
      # to BTC_CURVE_TOKEN: the page is off and /healthz says why under sports.audiencePages.
      # Set in the dashboard (Render's Generate makes a value), not here.
      # - key: PROSPECT_PAGE_KEY
      #   sync: false
      # - key: SPORTS_VENUES_INTERVAL_SEC
      #   value: "60"
      # Hours of sports snapshots held in memory for the page's window sections. 24 here; do
      # not raise it without measuring: 72 leaves under 100 MB of this plan's 512 MB.
      # - key: SPORTS_VENUES_WINDOW_HOURS
      #   value: "24"
      # Crypto.com's exchange fee as the sports page counts it: flat (2 cents a contract to open
      # and 2 to close, the schedule's standard for a broker's customer) or weighted (0.07 x p x
      # (1 - p), which the schedule allows depending on the broker's connection). Flat when unset.
      # - key: SPORTS_VENUES_CRYPTOCOM_FEE
      #   value: "flat"

  - type: web
    name: atticus-event-demo-cross-venue
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventProtectXDemoService.ts
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - services/api/tests/**
        - .github/**
        - demo/**
        - services/api/src/btcCurve/**
        - services/api/src/sportsVenues/**
        - services/api/scripts/btc*.ts
        - services/api/scripts/sportsVenuesReportService.ts
        - services/api/scripts/eventShadow*.ts
        - services/api/scripts/memberApp*.ts
    # Funnel counters and the quote-receipts ledger live on a small disk so a
    # deploy does not zero them (without it both restart from /tmp, empty).
    disk:
      name: event-demo-cross-venue-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Gates the operator views: /admin/funnel, /api/admin/*, the partner console and the
      # operator's fields on /api/showcase and /api/receipts. A script sends it in the
      # x-admin-token header. A browser signs in at /operator (the token goes in the body of a
      # form, never in an address) and holds a cookie for EVENT_X_ADMIN_SESSION_HOURS (12).
      # On a page a visitor also reads, the operator's view is asked for with ?as=operator.
      - key: EVENT_X_ADMIN_TOKEN
        generateValue: true
      - key: EVENT_X_FUNNEL_PATH
        value: /var/data/event-demo-funnel.json
      - key: EVENT_X_LEDGER_PATH
        value: /var/data/cross-quotes.jsonl
      # Ceiling on protection's cost in bps of expected value; above it the
      # cheapest route is still rich insurance and the scan refuses honestly
      # (protection_too_rich). 0 turns the ceiling off.
      - key: EVENT_X_MAX_EV_COST_BPS
        value: "300"
      # Minimum credit a tier must pay to be offered: 25¢ and 0.25% of stake,
      # whichever is more (38¢ on 150 contracts). Below it the scan refuses
      # (credit_too_small) rather than offering pennies. Applied in the scan, so
      # the board, the embed and the shadow record agree.
      - key: EVENT_X_MIN_CREDIT_CENTS
        value: "25"
      - key: EVENT_X_MIN_CREDIT_BPS
        value: "25"
      # In play: a game that has started stays on the board and is quoted from the books as
      # they stand, for EVENT_X_IN_PLAY_HOURS after tip-off (default 4). The row says Live in
      # place of the tip-off and re-prices while its panel is open. On unless this says 0
      # (false, no, off). The shadow record's lock path (the other service, same module) reads
      # the same switch from its own environment and is on by default there too.
      - key: EVENT_X_IN_PLAY
        value: "1"
      # Which hedge venues are offered tonight (kalshi, prophetx, novig, polymarket; comma
      # separated). A venue left out is not priced, not shown in the Venue view and never sent
      # to. Unset, every route is offered, which puts Polymarket on the board; the demo shows
      # Kalshi, ProphetX and Novig.
      - key: EVENT_HEDGE_VENUES
        value: "kalshi,prophetx,novig"
      # Whether the public page names the venues the other side is priced on and routed to,
      # and the routing partner. Unset (the default), the page says "best of 3 venues", the
      # Venue view letters them (Venue A, B, C; a host that is itself one of them keeps its
      # name), the recording's caption and the footer stop naming venues, and the Parlays tab
      # drops the lock's venue word. Everything is still tracked and named on the ledger, the
      # receipts and the operator surfaces. Set to "1" to name them on the page again.
      # - key: EVENT_X_NAME_HEDGE_VENUES
      #   value: "1"
      # NOVIG BOOK. The Novig route prices from the venue's own market, read as the signed-dialect
      # reference book (the same read atticus-event-shadow calls "reference book A"). Without a
      # host the route is offered but every row reads "not read". The catalog and books are
      # PUBLIC, so the host alone turns the read on; the key pair is optional and only switches
      # the reads to the account-scoped paths. Set in the dashboard, never in git; copy the
      # values from atticus-event-shadow (Render does not share env between services).
      #   REFERENCE_BOOK_SIGNED_HOST=https://api....   the venue's API host, nothing else needed
      #   REFERENCE_BOOK_SIGNED_KEY_ID=<key id>          optional, with the PEM
      #   REFERENCE_BOOK_SIGNED_PRIVATE_KEY_PEM=<PKCS8 PEM>
      #   REFERENCE_BOOK_SIGNED_LEAGUES=nba=<venue's word>  optional; copy if the shadow sets it
      # With no REFERENCE_BOOK_SIGNED_HOST the route falls back to VENUE_API_HOST when that is set.
      - key: REFERENCE_BOOK_SIGNED_HOST
        sync: false
      # POLYMARKET US BOOK (the US exchange; a price reference beside each quote, never the route,
      # no order is sent). Optional here: atticus-event-shadow is where the record is kept. To
      # have this board read it too, set the same pair in this service's dashboard, never in git:
      #   POLYMARKET_US_KEY_ID / POLYMARKET_US_SECRET_KEY   live books off the venue's stream
      #   REFERENCE_BOOK_POLY_US=public                     or: no key, the public copy (up to 30 s old)
      # Details under POLYMARKET US on atticus-event-shadow below.
      # Embed demo (/): host names honoured on ?brand=, comma-separated; anything
      # else renders as EVENT_X_EMBED_BRAND. These names carry a colourway and a
      # light/dark shell (scripts/eventProtectEmbedHtml.ts BRAND_PRESETS); any
      # other allowlisted name gets the generic slate palette. Sportsbook presets
      # hide the crypto strikes (?kind=all shows them). Partner console
      # (/partner, operator token) shows the host's revenue share at this percent.
      - key: EVENT_X_BRAND_ALLOWLIST
        value: "ProphetX,Novig,Sporttrade,Kalshi,Polymarket,DraftKings,FanDuel,PrizePicks,Underdog,Robinhood,Coinbase,Kraken,WagerWire,Wire Markets"
      # What the front door (/) calls the host when the link carries no ?brand=.
      - key: EVENT_X_EMBED_BRAND
        value: "Your Exchange"
      # A branded shell (?brand=Wire Markets) links its "record" to that venue's slate on
      # the shadow service, /slate/<slug>?k=<derived key>, instead of the full public
      # record. The derived key is HMAC(EVENT_SHADOW_SLATE_KEY, slug), so this must be
      # the SAME value as EVENT_SHADOW_SLATE_KEY on atticus-event-shadow (copy it by
      # hand in the dashboard; Render does not share generated values across
      # services). Unset, branded shells fall back to the full public record.
      - key: EVENT_SHADOW_SLATE_KEY
        sync: false
      # Where the public /partner page's "Talk to us" goes.
      - key: EVENT_X_CONTACT_EMAIL
        value: "michael@atticustrade.com"
      - key: EVENT_X_PARTNER_SHARE_PCT
        value: "50"

  # Shadow run: the cross-venue router quoted continuously, every position
  # marked against official results as events settle. The persistent disk is
  # the point: the track record and the lock ledgers must survive deploys.
  # As committed here every hedge is simulated at the book and nothing is
  # bought. This is also the one service that is given venue trading keys in
  # the dashboard and can send real orders once armed: see LIVE HEDGE below
  # and the header of this file.
  - type: web
    name: atticus-event-shadow
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventShadowWorker.ts
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - docs/**
        - "**/*.md"
        - services/api/tests/**
        - .github/**
        - demo/**
        - services/api/src/btcCurve/**
        - services/api/src/sportsVenues/**
        - services/api/scripts/btc*.ts
        - services/api/scripts/sportsVenuesReportService.ts
    disk:
      name: event-shadow-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVENT_SHADOW_LEDGER_PATH
        value: /var/data/event-shadow-ledger.jsonl
      # LEDGER FINGERPRINTS. On with nothing set here. One SHA-256 per closed UTC day of the ledger,
      # chained, is recorded once in /var/data/event-shadow-ledger.fingerprints.jsonl (same disk,
      # a few hundred bytes a day; each lock ledger gets its own file the same way), printed on the
      # record page and listed at /api/shadow/fingerprints. The ledger is hashed again from its
      # first byte at start-up and once a day and compared with what was published; a mismatch is
      # said on the page, on /healthz and by alert, and is never repaired. A fingerprint only binds
      # once someone outside this disk holds it, so save the list off this box with the nightly
      # backup. To check a backup: services/api/scripts/eventLedgerFingerprint.ts (its header).
      # Two knobs, both optional and not set here:
      #   EVENT_SHADOW_FINGERPRINTS=0              turns it off (no section, no route, no file)
      #   EVENT_SHADOW_FINGERPRINT_CHECK_MS=<ms>   how often the full check runs (default 86400000)
      # The shadow scans with the demo's scanner, so the same EV-cost ceiling applies:
      # rows above it are recorded as protection_too_rich refusals, not opened.
      - key: EVENT_X_MAX_EV_COST_BPS
        value: "300"
      # PINNED EXECUTION. A lock on a ticker armed for live orders is pinned to the venue the
      # executor can send to (Kalshi's own No side), while the engine still prices both routes.
      # Unset, the pinned route is judged on its own cost and a lock refuses as too_expensive
      # whenever Polymarket would have been the cheaper hedge (most NBA nights at small size).
      # Set to a whole number of cents, the lock stands when the holder's floor, cap and credit on
      # Kalshi are each within that many cents of the cheaper route's (0 = equal or better): the
      # holder is offered the same deal they would get anywhere, the ceiling judges the cheaper
      # route's cost, and the execution premium is ours, disclosed on the operator's quote as
      # routing.pinnedExecution. Terms worse than the tolerance stay refused.
      # 5: measured on the Oct 27 Pistons-Knicks game at 15 and 25 contracts, Kalshi's terms sit
      # 1c under on the cap and 5c under on the credit (Knicks), 5c under on the floor (Pistons);
      # 4 refuses both, 5 stands both. Premium absorbed: 155 and 280 bps of a $15-$25 stake.
      - key: EVENT_X_PINNED_TOLERANCE_CENTS
        value: "5"
