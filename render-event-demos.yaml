      - key: POLYMARKET_BUILDER_CODE
        value: "0x7c25351b760a956a2617e4574ba775190a0483944143b8f14e40733d1f5eff16"
      # LIVE HEDGE (off here; set in the dashboard for the live-order demo, never in git):
      #   EVENT_HEDGE_STRATEGY=live             real Kalshi orders behind rails; anything the
      #                                         rails hold is simulated at the book, reason on the receipt
      #   KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM   service env only; the extension never sees them
      #   EVENT_HEDGE_LIVE_TICKERS=KX...,KX...  allowlist; empty allows nothing
      #   EVENT_HEDGE_LIVE_MAX_CONTRACTS_PER_ORDER=25 / EVENT_HEDGE_LIVE_MAX_CONTRACTS_PER_DAY=100
      #   EVENT_HEDGE_LIVE_SEND=yes             the only value that sends; anything else is a dry run
      #   EVENT_HEDGE_KILL_SWITCH=1             no hedge order leaves, whatever else is set. It stands
      #                                         in front of every strategy: under rfq no request is
      #                                         sent and no quote can be accepted. It does not reach
      #                                         a member's own sale (MEMBER_APP_*) or the operator's
      #                                         Kalshi account routes; the runbook's pause steps do.
      #   EVENT_HEDGE_LIVE_VIA=aggregator       the order goes through the aggregator's execution pod
      #                                         instead of our own Kalshi key: the pod holds a numbered
      #                                         Kalshi subaccount of ours, we sign with a TRADE key bound
      #                                         to that pod, and the hedge is on the partner's books as
      #                                         well as the venue's. Same rails, same dry run; the fill
      #                                         says via "aggregator". Default: direct.
      #   AGGREGATOR_TRADE_KEY_ID / AGGREGATOR_TRADE_PRIVATE_KEY_HEX   the TRADE key (not the DATA key below);
      #                                         generated in the partner's portal, private half here only
      # HEDGE FIRST (hedgeFirst.ts): when every setting above lets an order leave (live, the ticker
      #   armed, SEND=yes, no kill switch, a key for the venue), a tap buys the hedge BEFORE the lock is
      #   written, all or none. The whole hedge fills: the lock is written at the quoted terms. Nothing
      #   fills, or a cap holds the order: no lock, the holder is told to try again. A part fill or an
      #   order that errored after it left: no lock, and the alert sink is paged (kind hedge_stray) to
      #   look on the venue. Every attempt is two lines in lock-pending.jsonl beside the lock ledger
      #   (EVENT_SHADOW_LOCK_PENDING_PATH to move it). In a dry run nothing changes: the record is
      #   written and the fill is simulated at the book, as before.
      #   Operator: GET /api/shadow/lock/pending is the trail (attempts by ending, open lines, strays);
      #   POST /api/shadow/lock/pending/clear?id=...&note=... marks one checked. the operator's /healthz carries
      #   lock.hedgeFirst: `unresolved` and `strays` must both read empty.
      # REAL-ONLY HOLDERS (realOnlyHolders.ts): the holders whose lock must have a real hedge behind
      #   it, or not exist. For a holder named here, a tap where the order would not truly leave
      #   (not live, kill switch, dry run, no key for the venue, game not armed) is refused in plain
      #   words and nothing is written; the quote there says Lock in is not open; leaving a lock that
      #   holds a real hedge needs a real sale of it. Everyone not named keeps the paper path above.
      #   EVENT_SHADOW_REAL_ONLY_HOLDERS=ann,bob   holder aliases from EVENT_SHADOW_HOLDER_KEYS
      #   EVENT_SHADOW_REAL_ONLY_HOLDERS=*         every caller: each holder, the shared key, the operator
      #   Default: unset, nobody. An entry that is not an alias and not * is read as * (the safe
      #   side) with a note in /healthz. Adding a person outside the company is two settings and no
      #   code: their key in EVENT_SHADOW_HOLDER_KEYS, their alias here. the operator's /healthz carries
      #   lock.realOnly: who is named, the holders with a key who are not, and the refusals so far.
      # USER TERMS (termsAcceptance.ts): the version of the user terms in force, and each holder's
      #   acceptance of it on the record. Both settings, or neither:
      #   EVENT_SHADOW_TERMS_VERSION=2026-11-20        the label printed on the document
      #   EVENT_SHADOW_TERMS_URL=https://...           where that version can be read (https only)
      #   Default: both unset, no terms in force, nobody is asked. With both set, a named holder (own
      #   key, hosted-page member, or the operator acting for a holder) with no acceptance of that
      #   version is refused at the quote and at the tap, with the link; they accept with one tap.
      #   The shared key and the operator acting for nobody are not asked. One set without the
      #   other, or one that cannot be read, refuses every named holder until corrected (a note in
      #   /healthz says which). Acceptances are lines in terms-acceptances.jsonl beside the lock
      #   ledger (EVENT_SHADOW_TERMS_PATH to move it). the operator's /healthz carries lock.terms: the
      #   version, who has not accepted, the refusals so far.
      # EXPOSURE CAPS (exposureCaps.ts): how much real money may be open at once. Read from the
      #   ledgers at each real-money lock, before the hedge order is built; a lock that would pass
      #   any of the three is refused with the cap and the amount, on one line in lock-pending.jsonl
      #   (type cap_refused). Simulated locks are not measured and not refused. Values are whole
      #   cents. Unset is the default below, never "no cap". The word `none` is the only way to
      #   say no cap, and /healthz then reads "no cap". Anything else that is not a whole number
      #   is the default, with a note in /healthz.
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_GAME=5000      default $50. Per game, both sides and
      #                                         every holder together: floors owed if the side loses,
      #                                         plus credits, plus what the hedges cost.
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_VENUE=10000    default $100. Per hedge venue: what the
      #                                         unsettled hedges bought there cost (cash resting there).
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_VENUE_KALSHI   optional, one venue's own cap in place of
      #   ..._PER_VENUE_NOVIG / _PROPHETX / _POLYMARKET      the one above (a new exchange capped lower).
      #                                         Default: unset, the venue takes the cap above.
      #   EVENT_HEDGE_LIVE_MAX_OPEN_CENTS_PER_HOLDER=5000    default $50. Per holder key: for each
      #                                         open lock the larger of what we can owe them (floor
      #                                         plus unpaid credit) and what they can owe us (the
      #                                         slice above the cap, handed back if their side wins).
      #   The defaults are sized for $5 to $20 positions: about $5 to $25 on the game per lock.
