      #   The caps also stand in front of EVENT_HEDGE_STRATEGY=rfq when it holds a venue key: that
      #   strategy can accept a real quote; its only other rail is the kill switch (no order caps).
      # PILOT CHECK (pilotCheck.ts), operator: GET /pilot-check (a page) and
