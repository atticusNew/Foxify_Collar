# ─────────────────────────────────────────────────────────────────────────
# render-event-demos.yaml — the two Earn & Protect EVENT demos + a relay
#
# All three services are READ-ONLY demonstrations: no venue credentials, no
# wallets, public market-data endpoints only. Nothing here touches the live
# production Earn & Protect deploy (isolation: src/eventCollar/** only).
#
#   atticus-event-demo-btc          Tier 1: Kalshi BTC price event, hedged on
#                                   live OKX option books. Region singapore:
#                                   OKX is reliably reachable there (same
#                                   region as the existing OKX services).
#
#   atticus-event-demo-cross-venue  Tier 2: Kalshi sports market, hedged with
#                                   the SAME game on Polymarket. Region oregon:
#                                   Kalshi + Polymarket public APIs are proven
#                                   reachable from US networks.
#
#   atticus-pm-clob-egress-proxy    GET-only relay for clob.polymarket.com,
#                                   for operator machines whose ISP blocks it
#                                   (observed: silent connect timeouts). Local
#                                   use: PM_CLOB_REST_BASE=
#                                   https://<service>.onrender.com/t/<PROXY_TOKEN>
#                                   Holds no credentials; path allowlist /book.
#
# Deploy: Render dashboard → New → Blueprint → select this file on branch
# cursor/tier2-cross-venue-2bfa. autoDeploy keeps the demos on the branch tip.
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: atticus-event-demo-btc
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventProtectDemoService.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production

  - type: web
    name: atticus-event-demo-cross-venue
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventProtectXDemoService.ts
    healthCheckPath: /healthz
    # Funnel counters and the quote-receipts ledger live on a small disk so a
    # deploy does not zero them (without it both restart from /tmp, empty).
    disk:
      name: event-demo-cross-venue-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Gates GET /api/admin/funnel (read with ?token=... or x-admin-token).
      - key: EVENT_X_ADMIN_TOKEN
        generateValue: true
      - key: EVENT_X_FUNNEL_PATH
        value: /var/data/event-demo-funnel.json
      - key: EVENT_X_LEDGER_PATH
        value: /var/data/cross-quotes.jsonl
      # Ceiling on protection's cost in bps of expected value; above it the
      # cheapest route is still rich insurance and the scan refuses honestly
      # (protection_too_rich). 0 turns the ceiling off.
      - key: EVENT_X_MAX_EV_COST_BPS
        value: "300"
      # Minimum credit a tier must pay to be offered: 25¢ and 0.25% of stake,
      # whichever is more (38¢ on 150 contracts). Below it the scan refuses
      # (credit_too_small) rather than offering pennies. Applied in the scan, so
      # the board, the embed and the shadow record agree.
      - key: EVENT_X_MIN_CREDIT_CENTS
        value: "25"
      - key: EVENT_X_MIN_CREDIT_BPS
        value: "25"
      # Embed demo (/): host names honoured on ?brand=, comma-separated; anything
      # else renders as EVENT_X_EMBED_BRAND. These names carry a colourway and a
      # light/dark shell (scripts/eventProtectEmbedHtml.ts BRAND_PRESETS); any
      # other allowlisted name gets the generic slate palette. Sportsbook presets
      # hide the crypto strikes (?kind=all shows them). Partner console
      # (/partner, operator token) shows the host's revenue share at this percent.
      - key: EVENT_X_BRAND_ALLOWLIST
        value: "ProphetX,Novig,Sporttrade,Kalshi,Polymarket,DraftKings,FanDuel,PrizePicks,Underdog,Robinhood,Coinbase,Kraken,WagerWire,Wire Markets"
      # What the front door (/) calls the host when the link carries no ?brand=.
      - key: EVENT_X_EMBED_BRAND
        value: "Your Exchange"
      # A branded shell (?brand=Wire Markets) links its "record" to that venue's slate on
      # the shadow service, /slate/<slug>?k=<derived key>, instead of the full public
      # record. The derived key is HMAC(EVENT_SHADOW_SLATE_KEY, slug), so this must be
      # the SAME value as EVENT_SHADOW_SLATE_KEY on atticus-event-shadow (copy it by
      # hand in the dashboard; Render does not share generated values across
      # services). Unset, branded shells fall back to the full public record.
      - key: EVENT_SHADOW_SLATE_KEY
        sync: false
      # Where the public /partner page's "Talk to us" goes.
      - key: EVENT_X_CONTACT_EMAIL
        value: "michael@atticustrade.com"
      - key: EVENT_X_PARTNER_SHARE_PCT
        value: "50"

  # Shadow run: the cross-venue router quoted continuously, every position
  # marked against official results as events settle. The persistent disk is
  # the point — the track record must survive deploys. Read-only like the
  # demos: public market data only, nothing is bought.
  - type: web
    name: atticus-event-shadow
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventShadowWorker.ts
    healthCheckPath: /healthz
    disk:
      name: event-shadow-ledger
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVENT_SHADOW_LEDGER_PATH
        value: /var/data/event-shadow-ledger.jsonl
      # The shadow scans with the demo's scanner, so the same EV-cost ceiling applies:
      # rows above it are recorded as protection_too_rich refusals, not opened.
      - key: EVENT_X_MAX_EV_COST_BPS
        value: "300"
      # Open mix: crypto strikes roll over hourly and would fill the record (3 of 4 opens on the
      # first book). The product lives on game positions, so crypto is held to a quarter of the
      # trailing day's opens, with a small allowance so an overnight book with no games still
      # records something.
      - key: EVENT_SHADOW_CRYPTO_SHARE_MAX
        value: "0.25"
      - key: EVENT_SHADOW_CRYPTO_FLOOR_PER_DAY
        value: "2"
      # Early closes: this share of positions leave before the lock, priced as a new trade at
      # the live books that second (both legs sold into the bids). The record then shows what
      # leaving early paid against holding, and what crossing the books cost against the mid.
      # 0 disables. The draw is a hash of the ticker, so a redeploy replays the same schedule.
      - key: EVENT_SHADOW_EARLY_CLOSE_SHARE_PCT
        value: "20"
      # Last leg of a parlay: a second ledger on the same disk. Simulated tickets of 2 to 5
      # favourites from Polymarket's combo leg catalog (there is no public list of real
      # tickets), real results and real books. When every earlier leg has hit, the compressed
      # position on the last leg is priced with the same collar search and the terms are
      # recorded once; nothing is bought. Defaults: $20 stake, 10-minute tick. EVENT_LASTLEG_ENABLED=0
      # turns it off. Public: the lock-sell-hold card on the record and /api/shadow/parlays (retail
      # shape; the demo's Parlays tab reads it). Operator views: /api/shadow/lastleg{,.csv}.
      - key: EVENT_LASTLEG_LEDGER_PATH
        value: /var/data/event-shadow-lastleg.jsonl
      # Ceiling on undecided tickets per size (2, 3, 4 and 5 legs). The default of two kept the
      # record to eight tickets in play; the Parlays tab is a positions list, so five per size
      # gives it up to twenty rows across the week's slate while staying under EVENT_LASTLEG_MAX_OPEN.
      - key: EVENT_LASTLEG_TICKETS_PER_SIZE
        value: "5"
      # No game on more than three undecided tickets at once (EVENT_LASTLEG_MAX_PER_GAME, default 3):
      # the biggest market would otherwise sit on every ticket and one upset would bust the whole board.
      # Venue slates: the record cut to one venue's leagues with its name on the page, at
      # /slate/<slug>?k=<EVENT_SHADOW_SLATE_KEY> (and /slate/<slug>.csv). One slate per
      # semicolon, slug=Name:leagues; an empty league list is every sports league. Reached
      # only by the share key or the operator token, never linked from the public record, so a
      # prospect's name appears only on a link we chose to send. Nothing is read from the venue.
      - key: EVENT_SHADOW_SLATES
        value: "wiremarkets=Wire Markets:nfl,nba,mlb,nhl,epl,ucl,mls;wagerwire=WagerWire:nfl,nba,mlb,nhl;sporttrade=Sporttrade:nfl,nba,mlb,nhl;novig=Novig:nfl,nba,mlb,nhl;draftkings=DraftKings:nfl,nba,mlb,nhl;underdog=Underdog:nfl,nba,mlb,nhl;prophetx=ProphetX:nfl,nba,mlb,nhl,epl,ucl,mls;prizepicks=PrizePicks:nfl,nba,mlb,nhl"
      - key: EVENT_SHADOW_SLATE_KEY
        generateValue: true
      # Where the slate page's "Open the demo" goes (renders in the venue's brand with ?brand=).
      - key: EVENT_SHADOW_DEMO_URL
        value: https://atticus-event-demo-cross-venue.onrender.com
      # Gates the operator views: /report, /api/shadow/report, /api/shadow/hedges,
      # /api/shadow/lastleg, /api/shadow/export and the full positions CSV (?token=... or x-admin-token).
      # Fail-closed: without it those routes answer 403 and the public record stays up.
      - key: EVENT_X_ADMIN_TOKEN
        generateValue: true
      # Polymarket Builders Program attribution. This is the PUBLIC bytes32 Builder Code
      # (0x + 64 hex) from polymarket.com/settings?tab=builder, attached as `builderCode`
      # to every Polymarket order we place. Not the Builder API key: that is a UUID, is a
      # secret, is never put on an order, and is refused here with a healthz note if pasted
      # by mistake. The shadow (book mode) sends no orders, so this only takes effect once
      # EVENT_HEDGE_STRATEGY=rfq and POLY_* credentials are set. Public value, safe in git.
      - key: POLYMARKET_BUILDER_CODE
        value: "0x7c25351b760a956a2617e4574ba775190a0483944143b8f14e40733d1f5eff16"
      # LIVE HEDGE (off here; set in the dashboard for the live-order demo, never in git):
      #   EVENT_HEDGE_STRATEGY=live             real Kalshi orders behind rails; anything the
      #                                         rails hold is simulated at the book, reason on the receipt
      #   KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM   service env only; the extension never sees them
      #   EVENT_HEDGE_LIVE_TICKERS=KX...,KX...  allowlist; empty allows nothing
      #   EVENT_HEDGE_LIVE_MAX_CONTRACTS_PER_ORDER=25 / EVENT_HEDGE_LIVE_MAX_CONTRACTS_PER_DAY=100
      #   EVENT_HEDGE_LIVE_SEND=yes             the only value that sends; anything else is a dry run
      #   EVENT_HEDGE_KILL_SWITCH=1             nothing leaves, whatever else is set
      #   EVENT_HEDGE_LIVE_VIA=aggregator       the order goes through the aggregator's execution pod
      #                                         instead of our own Kalshi key: the pod holds a numbered
      #                                         Kalshi subaccount of ours, we sign with a TRADE key bound
      #                                         to that pod, and the hedge is on the partner's books as
      #                                         well as the venue's. Same rails, same dry run; the fill
      #                                         says via "aggregator". Default: direct.
      #   AGGREGATOR_TRADE_KEY_ID / AGGREGATOR_TRADE_PRIVATE_KEY_HEX   the TRADE key (not the DATA key below);
      #                                         generated in the partner's portal, private half here only
      # Pre-flight (operator): GET /api/shadow/hedges/preflight?ticker=KX... reads balance and the rails
      #   (via aggregator: the pod's identity, its Kalshi cash and whether the key may trade).
      # The pod (operator): GET /api/shadow/hedges/pod reads the aggregator's side — pod, cash, positions,
      #   and every receipt on our trail that went that way. ?ticker= narrows the positions.
      # KALSHI ACCOUNT (operator; needs KALSHI_API_KEY_ID / KALSHI_PRIVATE_KEY_PEM, in any strategy):
      #   GET  /api/shadow/kalshi/account                 API tier and grants, cash per shard, subaccounts per shard, what to do next
      #   POST /api/shadow/kalshi/account/upgrade         the permanent Advanced grant (Kalshi wants one API-created order among the last 100)
      #   POST /api/shadow/kalshi/subaccounts?shard=0     the next numbered subaccount on that shard (again with ?shard=3 for basketball)
      #   POST /api/shadow/kalshi/subaccounts/transfer    {"from":0,"to":1,"cents":5000,"shard":0}   cash between subaccounts, one shard
      #   POST /api/shadow/kalshi/shards/transfer         {"fromShard":0,"toShard":3,"cents":5000}  the primary's cash across shards
      #   Shards: Kalshi holds a subaccount's cash per matching engine; NFL is shard 0, basketball/baseball/
      #   tennis shard 3; a subaccount that hedges both needs cash on both. Nothing here places an order.
      # Resend (operator): POST /api/shadow/hedges/resend?ticker=KX... hedges an open lock again when
      #   its hedge never reached the venue (simulated fill on the trail); refuses once a live fill
      #   exists unless &force=1. Orders go to Kalshi's V2 path (POST /portfolio/events/orders).
      # Lock reset (operator): POST /api/shadow/lock/reset?ticker=KX... moves one lock's lines to an
      #   archive beside the lock ledger so the market can be locked again; names the live fills the
      #   venue still holds for the old lock. The holder's receipt: GET /api/shadow/receipt?ticker= (lock key).
      # LOCK IN (the tap from the browser extension; off here, set in the dashboard, never in git):
      #   EVENT_SHADOW_LOCK_KEY=<12+ chars>     opens GET /api/shadow/markets, GET /api/shadow/quote,
      #                                         GET /api/shadow/positions and POST /api/shadow/lock to
      #                                         callers sending x-lock-key.
      #                                         Unset: those routes answer 404 to anyone but the operator.
      #   Locks are written to their own ledger beside the scan's (lock-ledger.jsonl on the same
      #   disk; EVENT_SHADOW_LOCK_LEDGER_PATH to move it), so a holder may lock a market the scan
      #   already shows. Same settlement; never early-closed. Operator export: /api/shadow/export?ledger=lock
      #   Tickers on EVENT_HEDGE_LIVE_TICKERS are hedged on Kalshi's own No side and skipped by the scan.
      # HOLDER POSITIONS (optional; confirms what the holder has at the venue so the extension does not
      # have to read sizes off the page). Two venue APIs are spoken; the variables set pick one. Set in
      # the dashboard, never in git. Unset: /api/shadow/positions answers configured:false and the
      # extension reads the row from the page.
      # Bearer venue (partner API, session login; the venue issues the pair at Settings > Token. It is an
      # account key pair, so it could trade: dedicated pair, service env only, revoke after the recording.
      # The service only logs in and reads open plays, tournaments, events, markets):
      #   VENUE_API_HOST=https://cash.api..../partner   the partner API base, with the /partner path
      #   VENUE_API_ACCESS_KEY=<access key>
      #   VENUE_API_SECRET_KEY=<secret key>
      # Signed venue (read-only key minted with scripts/venueReadKey.ts; lists positions, nothing else):
      #   VENUE_API_HOST=https://api....         the venue's API host (paper host for a rehearsal)
      #   VENUE_API_KEY_ID=<key id>              the read key's id
      #   VENUE_API_PRIVATE_KEY_PEM=<PKCS8 PEM>   the read key's private key; "\n" escapes accepted
      # Both:
      #   EVENT_SHADOW_POSITIONS_TTL_MS=20000    how long one read is reused
      # REFERENCE BOOKS (optional; other regulated US exchanges listing the same games, read on every
      # sports open so the record carries what the default tier would have cost hedged there. Price
      # reference only: never picks the route, never changes the quote, nothing is filled. The public
      # page calls them "reference book A" (signed API) and "reference book B" (partner API); the
      # record carries the dialect ids signed_v3 and partner_mm, never a venue name. Set in the
      # dashboard, never in git. Unset: no reference is read. Either may be set alone.
      # Signed venue. Its catalog and books are PUBLIC, so the host alone turns the reference on
      # (unsigned reads of /v3/public/catalog); the key is optional and only switches the reads to
      # the signed, account-scoped paths:
      #   REFERENCE_BOOK_SIGNED_HOST=https://api....   the venue's API host, nothing else needed
      #   REFERENCE_BOOK_SIGNED_KEY_ID=<key id>          optional, with the PEM
      #   REFERENCE_BOOK_SIGNED_PRIVATE_KEY_PEM=<PKCS8 PEM>
      #   A key the venue's account-scoped catalog refuses (423 ACCOUNT_LOCKED, 401, 403) is not
      #   fatal: catalog and book reads fall back to the public catalog for one cache window and
      #   /api/shadow/venues/catalog says so in `note`. Positions have no public path.
      #   REFERENCE_BOOK_SIGNED_LEAGUES=nba=<venue's word>  optional; a league the venue files under
      #     another word (read it off /api/shadow/venues/catalog?league=nba, leaguesSeen). Unset, a
      #     league that lists nothing under our code is searched once more on the unfiltered page.
      # Partner venue (same account key pair kind as above; only login, tournaments, events and
      # markets are read; dedicated pair, revoke when done):
      #   REFERENCE_BOOK_BEARER_HOST=https://cash.api..../partner
      #   REFERENCE_BOOK_BEARER_ACCESS_KEY=<access key>
      #   REFERENCE_BOOK_BEARER_SECRET_KEY=<secret key>
      # Status: the operator state's hedge.referenceBooks lists which are configured, never the keys.
      # AGGREGATOR FEED (optional; the cross-venue data partner's signed API and orderbook stream).
      # With the key set, every sports quote reads its books from the feed FIRST: the opposing
      # outcome on the second venue, our own market's No side, and the same outcome on the venues
      # this service has no direct read for (kept as "reference book B (via the aggregator)" /
      # "reference book C (via the aggregator)", ids aggregated_mm / aggregated_other). Whatever
      # the feed cannot supply for a pair is read from the venue directly, as before; a mapping
      # that disagrees with ours is never priced from. A DATA key is all this needs (it refuses
      # venue paths); the TRADE key that sends orders is AGGREGATOR_TRADE_* under LIVE HEDGE above.
      # Set in the dashboard, never in git. Unset: the venues are read directly, nothing changes.
      #   AGGREGATOR_KEY_ID=<key id>
      #   AGGREGATOR_PRIVATE_KEY_HEX=<64 hex seed, or a PKCS8 PEM>
      #   AGGREGATOR_API_HOST / AGGREGATOR_STREAM_URL   optional; default to the partner's hosts
      # Status: hedge.pricingSource (configured, reads, readsWithBooks, mappingMismatches, lastError), never the key.
      # REFERENCE PRINTS (optional; a regulated US exchange that publishes no live book, only every
      # trade it matched the day before, in the CFTC's public reporting format, as a public file).
      # On every sports open the record keeps the opposing side's last print there, its size and
      # its age, beside the price the live hedge paid. Never priced as a route (a day-old print is
      # nothing a hedge could have been filled at), never touches the quote. The public page calls
      # it "reference prints C"; the record carries the id public_prints, never a venue name. No
      # credentials: the host alone turns it on. Unset: nothing is read.
      #   REFERENCE_PRINTS_HOST=https://cftc-public-reports....   the origin that serves /reporting/trade_data_YYYY-MM-DD.json.gz
      # Status: the operator state's hedge.referencePrints says whether it is on.

  - type: web
    name: atticus-pm-clob-egress-proxy
    runtime: node
    plan: starter
    region: oregon
    branch: cursor/tier2-cross-venue-2bfa
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api exec tsx scripts/eventEgressProxy.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTREAM
        value: https://clob.polymarket.com
      - key: ALLOWED_PREFIXES
        value: /book
      # URL token — the only gate on the relay. Copy its generated value into the
      # operator machine's PM_CLOB_REST_BASE. Rotate by editing here.
      - key: PROXY_TOKEN
        generateValue: true
