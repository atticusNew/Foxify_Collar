# ─────────────────────────────────────────────────────────────────────────
# render-okx-directional.yaml — Atticus PRODUCT BOOK shadow (neutral pairs)
#
# HISTORY: this service originally ran the partner-era directional/auto book
# (trend singles on elevated days). The partner is gone and the product being
# sold is the self-funding NEUTRAL book, so as of 2026-08-05 this service runs
# pairs-only: matched long/short pairs (pair-atomic), in calm AND elevated
# regimes (elevated keeps the widened cap via the 6% floor override; HALT
# still pauses opens). No directional risk is taken. The service name and disk
# are kept so the durable track record continues across the strategy switch.
# Paper settlement only — read-only, live tiers OFF, NO venue credentials.
#
# This YAML is the SOURCE OF TRUTH for the service: do not edit envs in the
# dashboard (a blueprint sync will overwrite them). Change them here and push.
#
# Deploy: Render dashboard → New → Blueprint → select this file.
# Dashboard: https://foxify-okx-directional.onrender.com (/, /simple, /api/scorecard)
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    # Renamed from foxify-okx-directional on 2026-08-05 (dashboard rename; this file must match or a
    # blueprint sync would spawn a duplicate service with an EMPTY disk). NOTE: the .onrender.com
    # subdomain is fixed at creation and does NOT follow the rename — public URL comes from the
    # custom domain (Settings → Custom Domains), e.g. demo.atticustrade.com.
    name: exchange-vol-fac
    runtime: node
    plan: starter
    region: singapore
    branch: cursor/bullish-fees-hedge-receipt-9151
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm --workspace services/api run shadow:service
    healthCheckPath: /healthz
    disk:
      name: okx-directional-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production

      # ── Strategy: the PRODUCT BOOK — neutral pairs only, no directional lane ──
      - key: SHADOW_DIRECTIONAL_BIAS
        value: flat                # matched long/short pairs (pair-atomic); no directional singles
      - key: SHADOW_REGIME_ELEVATED_MULT
        value: "1"                 # keep opening pairs in ELEVATED at the widened cap (6% floor
                                   # override still applies); HALT (≥3%) still pauses opens.
                                   # A matched pair's cap giveback is funded by that side's own
                                   # perp gain, so elevated pairs stay bounded — unlike singles.
      - key: SHADOW_PRODUCT_BOOK_SINCE
        value: "2026-08-05T04:30:00Z"  # strategy-switch timestamp: /onesheet segments positions
                                       # opened after this as the "current product book" (nothing
                                       # pre-switch is deleted; lifetime integrity stays intact)
      - key: PRINCIPAL_PAIRS_PATH
        value: /var/data/principal-pairs.jsonl  # principal book (LIVE capital) ledger — written by
                                                # the principal-pair CLI, rendered on / and /onesheet

      # ── Pilot terms (same as the neutral mirror) ──
      - key: SHADOW_HEDGE_VENUE
        value: okx
      - key: SHADOW_SETTLEMENT_HORIZON_MIN
        value: "1440"              # real 24h tenor
      - key: HARNESS_FEE_USDC
        value: "80"                # $80 credit target
      - key: HARNESS_TENOR_DAYS
        value: "1"
      - key: SHADOW_DAILY_POSITIONS
        value: "2"                 # pilot cadence: 2/day = 1 matched pair/day (pair-atomic)
      - key: SHADOW_POSITION_USDC
        value: "50000"
      - key: SHADOW_LOOP_INTERVAL_MS
        value: "900000"
      - key: SHADOW_TIER0_CAP_USDC
        value: "2000000"
      - key: HARNESS_BULLISH_WEIGHT
        value: "0"
      # Floor/σ-floor/credit pass-through: code defaults (6% floor, 1.1σ cap floor, full
      # pass-through). Neutral-mode gate thresholds apply (elevated 1.2%, halt 3.0%) with the
      # elevated multiplier overridden to 1 above. Override anything else only with intent.

      # ── Capital inputs (OKX-measured) ──
      - key: SHADOW_SHORT_OPTION_IM_FRACTION
        value: "0.14"
      - key: SHADOW_PM_NETTING
        value: "0.078"
      - key: SHADOW_COST_OF_CAPITAL
        value: "0.12"
      - key: SHADOW_COLLATERAL_USDC
        value: "25000"             # modeled principal pilot facility: $10k options deposit + perp
                                   # margin + buffer (was 5000 = the former partner's posting)

      # ── Disk stores — PINNED TO THE FILES ACTUALLY IN USE (2026-08-05 audit of /var/data).
      # The main stores carry historical "okx-mirror-*" filenames from how this service was first
      # configured; the newer stores use "okx-directional-*" names. The names are historical, the
      # FILES are the durable track record (1.6k+ sessions). DO NOT "clean up" or rename these
      # paths: repointing a store env to a fresh filename orphans the data (it already ate the
      # open book once tonight — recovered because the file survived). ──
      - key: SHADOW_STORE_PATH
        value: /var/data/okx-mirror-scorecards.jsonl
      - key: SHADOW_OPEN_POSITIONS_PATH
        value: /var/data/okx-directional-open.jsonl
      - key: SHADOW_SETTLEMENT_LEDGER_PATH
        value: /var/data/okx-mirror-settlements.jsonl
      - key: SHADOW_COLLATERAL_PATH
        value: /var/data/okx-mirror-collateral.json
      - key: SHADOW_OPENING_STATE_PATH
        value: /var/data/okx-directional-opening.json
      - key: SHADOW_PRICE_HISTORY_PATH
        value: /var/data/okx-directional-prices.jsonl

      # ── Public market-data bases (read-only; NO API keys) ──
      - key: OKX_REST_BASE
        value: https://www.okx.com
      - key: DERIBIT_REST_BASE
        value: https://www.deribit.com/api/v2
      - key: BULLISH_REST_BASE
        value: https://api.exchange.bullish.com

      - key: ORACLE_PRIVATE_KEY_PEM
        sync: false
      - key: ORACLE_PUBLIC_KEY_PEM
        sync: false
      - key: SHADOW_DASHBOARD_TOKEN
        sync: false
