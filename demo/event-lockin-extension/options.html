<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lock in: settings</title>
<style>
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#050d0a;margin:0;padding:18px;width:360px}
  h1{font-size:16px;margin:0 0 4px}
  p{color:#5c6a64;margin:0 0 14px;font-size:12.5px}
  label{display:block;font-weight:600;font-size:12.5px;margin-top:12px}
  input,select{width:100%;box-sizing:border-box;margin-top:4px;padding:8px 10px;border:1px solid #e4e7e7;border-radius:8px;font:inherit}
  button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:10px;background:#00b67a;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .ok{color:#014737;font-size:12.5px;margin-top:8px;min-height:18px}
  .fine{color:#98a49e;font-size:11.5px;margin-top:12px}
</style>
</head>
<body>
  <h1>Lock in: settings</h1>
  <p>The service prices, records and hedges. This extension only places the button.</p>
  <label>Service URL
    <input id="baseUrl" type="url" placeholder="https://atticus-event-shadow.onrender.com" />
  </label>
  <label>Lock key
    <input id="lockKey" type="password" autocomplete="off" placeholder="EVENT_SHADOW_LOCK_KEY on the service" />
  </label>
  <label>Default size when the row cannot be read (contracts)
    <input id="defaultContracts" type="number" min="1" max="10000" step="1" />
  </label>
  <label>Show the hedge line after a lock (operator)
    <select id="showHedge"><option value="no">No</option><option value="yes">Yes</option></select>
  </label>
  <button id="save">Save</button>
  <div class="ok" id="ok"></div>
  <div class="fine">No venue credential is stored here. The lock key lets this client ask; the service's rails decide what is sent.</div>
  <script src="options.js"></script>
</body>
</html>
